<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sentinela de Liquidez | POL/USDT</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;600;700&family=Space+Mono:wght@400;700&display=swap');

        :root {
            --bg-base: #0a0a0a;
            --dekton-copper: #cda434;
            --osb-warm: #d2a679;
            --danger-red: #ff2a2a;
            --success-green: #00ff88;
            --glass-bg: rgba(26, 24, 24, 0.65);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background-color: var(--bg-base);
            background-image: 
                radial-gradient(circle at 15% 50%, rgba(205, 164, 52, 0.05), transparent 50%),
                radial-gradient(circle at 85% 30%, rgba(0, 255, 255, 0.03), transparent 50%);
            color: #fff;
            font-family: 'Rajdhani', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            transition: all 0.3s ease;
        }

        .dashboard {
            background: var(--glass-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(205, 164, 52, 0.2);
            border-radius: 16px;
            box-shadow: 0 8px 32px rgba(205, 164, 52, 0.15), inset 0 0 20px rgba(0,0,0,0.5);
            width: 100%;
            max-width: 600px;
            padding: 30px;
            position: relative;
        }

        .dashboard::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; height: 2px;
            background: linear-gradient(90deg, transparent, var(--dekton-copper), transparent);
        }

        h1 {
            font-size: 1.2rem; text-transform: uppercase; letter-spacing: 4px;
            color: var(--osb-warm); text-align: center; margin-bottom: 20px;
        }

        .price-display { text-align: center; margin: 20px 0; }

        .ticker {
            font-family: 'Space Mono', monospace; font-size: 3.5rem; font-weight: 700;
            color: #fff; line-height: 1; transition: color 0.1s, text-shadow 0.1s;
        }

        .tick-up { animation: flash-green 0.5s ease-out; }
        .tick-down { animation: flash-red 0.5s ease-out; }

        @keyframes flash-green {
            0% { text-shadow: 0 0 40px var(--success-green); color: var(--success-green); }
            100% { text-shadow: 0 0 0px transparent; color: #fff; }
        }

        @keyframes flash-red {
            0% { text-shadow: 0 0 40px var(--danger-red); color: var(--danger-red); }
            100% { text-shadow: 0 0 0px transparent; color: #fff; }
        }

        /* STATUS BADGES */
        .status-container {
            display: flex;
            flex-direction: column;
            gap: 10px;
            align-items: center;
            margin-top: 15px;
        }

        .status-badge {
            padding: 6px 16px; border-radius: 20px; font-size: 0.85rem; font-weight: 700;
            text-transform: uppercase; letter-spacing: 2px;
            background: rgba(0, 255, 136, 0.1); color: var(--success-green);
            border: 1px solid var(--success-green); transition: all 0.3s;
        }

        .pool-badge {
            background: rgba(205, 164, 52, 0.1); color: var(--dekton-copper);
            border: 1px solid var(--dekton-copper);
        }

        .pool-flash { animation: pool-activity 0.8s ease-out; }

        @keyframes pool-activity {
            0% { background: var(--dekton-copper); color: #000; box-shadow: 0 0 30px var(--dekton-copper); transform: scale(1.05); }
            100% { background: rgba(205, 164, 52, 0.1); color: var(--dekton-copper); box-shadow: 0 0 0 transparent; transform: scale(1); }
        }

        .pulse-dot {
            display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 8px;
            background-color: currentColor; box-shadow: 0 0 10px currentColor;
            animation: ws-pulse 1.5s infinite alternate;
        }

        @keyframes ws-pulse {
            0% { opacity: 0.3; transform: scale(0.8); }
            100% { opacity: 1; transform: scale(1.2); }
        }

        .range-controls { display: flex; gap: 15px; margin-bottom: 25px; margin-top: 25px; }
        .input-group { flex: 1; display: flex; flex-direction: column; }
        .input-group label { font-size: 0.8rem; color: #888; margin-bottom: 5px; text-transform: uppercase; letter-spacing: 1px; }
        .input-group input {
            background: rgba(0, 0, 0, 0.5); border: 1px solid rgba(255, 255, 255, 0.1);
            color: var(--dekton-copper); font-family: 'Space Mono', monospace;
            font-size: 1.2rem; padding: 12px; border-radius: 8px; text-align: center;
        }
        .input-group input:focus { border-color: var(--dekton-copper); outline: none; }

        .variations-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
        .var-card {
            background: rgba(0, 0, 0, 0.4); border-left: 2px solid rgba(255,255,255,0.1);
            padding: 15px 10px; border-radius: 6px; text-align: center; display: flex; flex-direction: column; gap: 5px;
        }
        .var-label { font-size: 0.75rem; color: #aaa; letter-spacing: 1px; }
        .var-value { font-family: 'Space Mono', monospace; font-size: 1rem; font-weight: 700; }
        .positive { color: var(--success-green); border-left-color: var(--success-green); }
        .negative { color: var(--danger-red); border-left-color: var(--danger-red); }

        .btn-start {
            width: 100%; padding: 15px; margin-bottom: 20px;
            background: linear-gradient(45deg, var(--dekton-copper), #e6b93e);
            border: none; border-radius: 8px; color: #000; font-family: 'Rajdhani', sans-serif;
            font-size: 1.2rem; font-weight: 700; text-transform: uppercase; letter-spacing: 2px;
            cursor: pointer; box-shadow: 0 4px 15px rgba(205, 164, 52, 0.3);
        }

        body.alert-mode { background-color: #1a0505; }
        body.alert-mode .dashboard {
            border-color: var(--danger-red); box-shadow: 0 0 40px rgba(255, 42, 42, 0.2);
            animation: pulse-border 1s infinite alternate;
        }

        @keyframes pulse-border {
            0% { box-shadow: 0 0 20px rgba(255, 42, 42, 0.2); }
            100% { box-shadow: 0 0 60px rgba(255, 42, 42, 0.5); }
        }

        @media (max-width: 480px) {
            .variations-grid { grid-template-columns: repeat(2, 1fr); }
            .ticker { font-size: 2.8rem; }
        }
    </style>
</head>
<body>

    <div class="dashboard">
        <button id="btn-init" class="btn-start">Ativar Radares & Áudio</button>
        
        <h1>Sentinela Uniswap V3 | POL/USDT</h1>
        
        <div class="price-display">
            <div id="price" class="ticker">---.----</div>
            
            <div class="status-container">
                <div id="status" class="status-badge">Aguardando Preço...</div>
                <div id="pool-status" class="status-badge pool-badge">Aguardando Pool...</div>
            </div>
        </div>

        <div class="range-controls">
            <div class="input-group">
                <label>Faixa Mínima (USDT)</label>
                <input type="number" id="min-price" step="0.0001">
            </div>
            <div class="input-group">
                <label>Faixa Máxima (USDT)</label>
                <input type="number" id="max-price" step="0.0001">
            </div>
        </div>

        <div class="variations-grid">
            <div class="var-card" id="card-5m"><span class="var-label">5 MIN</span><span class="var-value" id="var-5m">--%</span></div>
            <div class="var-card" id="card-15m"><span class="var-label">15 MIN</span><span class="var-value" id="var-15m">--%</span></div>
            <div class="var-card" id="card-30m"><span class="var-label">30 MIN</span><span class="var-value" id="var-30m">--%</span></div>
            <div class="var-card" id="card-1h"><span class="var-label">1 HORA</span><span class="var-value" id="var-1h">--%</span></div>
            <div class="var-card" id="card-4h"><span class="var-label">4 HORAS</span><span class="var-value" id="var-4h">--%</span></div>
            <div class="var-card" id="card-8h"><span class="var-label">8 HORAS</span><span class="var-value" id="var-8h">--%</span></div>
            <div class="var-card" id="card-12h"><span class="var-label">12 HORAS</span><span class="var-value" id="var-12h">--%</span></div>
            <div class="var-card" id="card-1d"><span class="var-label">1 DIA</span><span class="var-value" id="var-1d">--%</span></div>
        </div>
    </div>

    <script>
        const SYMBOL = 'POLUSDT';
        const POOL_ADDRESS = '0x9B08288C3Be4F62bbf8d1C20Ac9C5e6f9467d8B7';
        const INTERVALS = ['5m', '15m', '30m', '1h', '4h', '8h', '12h', '1d'];
        
        let currentPrice = 0;
        let lastPrice = 0;
        let audioCtx = null;
        let isAlarmPlaying = false;
        let alarmInterval = null;

        const priceEl = document.getElementById('price');
        const statusEl = document.getElementById('status');
        const poolStatusEl = document.getElementById('pool-status');
        const minInput = document.getElementById('min-price');
        const maxInput = document.getElementById('max-price');
        const btnInit = document.getElementById('btn-init');
        const bodyEl = document.body;

        btnInit.addEventListener('click', async () => {
            // Inicializa e ACORDA a API de áudio (Crucial para não ficar mudo)
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            if (audioCtx.state === 'suspended') {
                await audioCtx.resume();
            }
            
            btnInit.style.display = 'none';
            statusEl.innerHTML = "<span class='pulse-dot'></span> Cotação Sincronizada";
            poolStatusEl.innerHTML = "<span class='pulse-dot'></span> Conectando à Polygon...";
            
            initBinanceWebSocket();
            initPolygonWebSocket();
            fetchVariations();
            setInterval(fetchVariations, 60000);
        });

        // ==========================================
        // 1. WEBSOCKET DA BINANCE (PREÇO)
        // ==========================================
        function initBinanceWebSocket() {
            const ws = new WebSocket(`wss://stream.binance.com:9443/ws/${SYMBOL.toLowerCase()}@ticker`);
            ws.onmessage = (event) => {
                const data = JSON.parse(event.data);
                const newPrice = parseFloat(data.c);
                
                if (lastPrice !== 0 && newPrice !== lastPrice) {
                    priceEl.classList.remove('tick-up', 'tick-down');
                    void priceEl.offsetWidth; 

                    if (newPrice > lastPrice) {
                        priceEl.classList.add('tick-up');
                        playAudioTone('tick-up');
                    } else {
                        priceEl.classList.add('tick-down');
                        playAudioTone('tick-down');
                    }
                }
                
                lastPrice = newPrice;
                currentPrice = newPrice;
                priceEl.innerText = currentPrice.toFixed(4);
                checkLiquidityRange();
            };
            ws.onerror = () => { statusEl.innerHTML = "Falha Binance. Reconectando..."; };
            ws.onclose = () => { setTimeout(initBinanceWebSocket, 2000); };
        }

        // ==========================================
        // 2. WEBSOCKET DA POLYGON RPC (ATIVIDADE DA POOL)
        // ==========================================
        function initPolygonWebSocket() {
            // Usando RPC público da Polygon que suporta WSS
            const wsPool = new WebSocket('wss://polygon-bor-rpc.publicnode.com');

            wsPool.onopen = () => {
                poolStatusEl.innerHTML = "<span class='pulse-dot'></span> Pool Monitorada";
                // Inscreve para ouvir QUALQUER log gerado pelo contrato da sua Pool
                const subscribeMsg = {
                    "jsonrpc": "2.0",
                    "id": 1,
                    "method": "eth_subscribe",
                    "params": ["logs", { "address": POOL_ADDRESS }]
                };
                wsPool.send(JSON.stringify(subscribeMsg));
            };

            wsPool.onmessage = (event) => {
                const response = JSON.parse(event.data);
                // Se a resposta for uma notificação de subscription, significa que houve transação!
                if (response.method === 'eth_subscription') {
                    
                    // Dispara a animação e o som de transação na pool
                    poolStatusEl.classList.remove('pool-flash');
                    void poolStatusEl.offsetWidth; // reflow
                    
                    poolStatusEl.innerHTML = "<span class='pulse-dot'></span> TRANSAÇÃO DETECTADA!";
                    poolStatusEl.classList.add('pool-flash');
                    playAudioTone('pool-event');

                    // Volta ao status normal após 2 segundos
                    setTimeout(() => {
                        poolStatusEl.innerHTML = "<span class='pulse-dot'></span> Pool Monitorada";
                    }, 2000);
                }
            };

            wsPool.onerror = () => { poolStatusEl.innerHTML = "Falha Polygon. Reconectando..."; };
            wsPool.onclose = () => { setTimeout(initPolygonWebSocket, 3000); };
        }

        // ==========================================
        // 3. API REST (VARIAÇÕES) E CHECAGEM DE RANGE
        // ==========================================
        async function fetchVariations() {
            for (let interval of INTERVALS) {
                try {
                    const response = await fetch(`https://api.binance.com/api/v3/klines?symbol=${SYMBOL}&interval=${interval}&limit=2`);
                    const data = await response.json();
                    const openPrice = parseFloat(data[0][1]);
                    const closePrice = parseFloat(data[data.length-1][4]);
                    const variation = ((closePrice - openPrice) / openPrice) * 100;
                    
                    const valEl = document.getElementById(`var-${interval}`);
                    const cardEl = document.getElementById(`card-${interval}`);
                    const isPositive = variation >= 0;
                    
                    valEl.innerText = `${isPositive ? '+' : ''}${variation.toFixed(2)}%`;
                    cardEl.className = 'var-card';
                    cardEl.classList.add(isPositive ? 'positive' : 'negative');
                } catch (e) {}
            }
        }

        function checkLiquidityRange() {
            const min = parseFloat(minInput.value);
            const max = parseFloat(maxInput.value);
            if (isNaN(min) || isNaN(max)) return;

            if (currentPrice < min || currentPrice > max) {
                if (!bodyEl.classList.contains('alert-mode')) {
                    bodyEl.classList.add('alert-mode');
                    statusEl.innerHTML = "<span class='pulse-dot'></span> PERDA IMPERMANENTE";
                    statusEl.style.color = 'var(--danger-red)';
                    statusEl.style.borderColor = 'var(--danger-red)';
                    triggerAlarm();
                }
            } else {
                if (bodyEl.classList.contains('alert-mode')) {
                    bodyEl.classList.remove('alert-mode');
                    statusEl.innerHTML = "<span class='pulse-dot'></span> Cotação Sincronizada";
                    statusEl.style.color = 'var(--success-green)';
                    statusEl.style.borderColor = 'var(--success-green)';
                    stopAlarm();
                }
            }
        }

        // ==========================================
        // 4. MOTOR DE ÁUDIO (AUMENTADO O VOLUME)
        // ==========================================
        function playAudioTone(type) {
            if (!audioCtx || isAlarmPlaying) return;
            
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            const now = audioCtx.currentTime;

            if (type === 'tick-up') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(800, now);
                osc.frequency.exponentialRampToValueAtTime(1200, now + 0.1);
                // Volume aumentado de 0.03 para 0.15 (15%)
                gain.gain.setValueAtTime(0, now);
                gain.gain.linearRampToValueAtTime(0.15, now + 0.02);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.1);
                
            } else if (type === 'tick-down') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(400, now);
                osc.frequency.exponentialRampToValueAtTime(250, now + 0.1);
                // Volume aumentado para 0.15
                gain.gain.setValueAtTime(0, now);
                gain.gain.linearRampToValueAtTime(0.15, now + 0.02);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.1);

            } else if (type === 'pool-event') {
                // Som cristalino para a Pool (lembrando vidro dicróico batendo)
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(1500, now);
                osc.frequency.exponentialRampToValueAtTime(3000, now + 0.15);
                // Volume um pouco mais alto (30%) para destacar
                gain.gain.setValueAtTime(0, now);
                gain.gain.linearRampToValueAtTime(0.3, now + 0.02);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.2);
            }

            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start(now);
            osc.stop(now + 0.2);
        }

        // SIRENE DE EMERGÊNCIA (OUT OF RANGE)
        function playSirenPulse() {
            if (!audioCtx) return;
            const osc1 = audioCtx.createOscillator();
            const osc2 = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            const now = audioCtx.currentTime;

            osc1.type = 'sawtooth';
            osc2.type = 'square';

            osc1.frequency.setValueAtTime(110, now);
            osc1.frequency.exponentialRampToValueAtTime(440, now + 0.4);
            osc2.frequency.setValueAtTime(220, now);
            osc2.frequency.exponentialRampToValueAtTime(880, now + 0.4);

            gainNode.gain.setValueAtTime(0, now);
            // Volume da sirene mantido agressivo
            gainNode.gain.linearRampToValueAtTime(0.3, now + 0.1);
            gainNode.gain.exponentialRampToValueAtTime(0.01, now + 0.5);

            osc1.connect(gainNode);
            osc2.connect(gainNode);
            gainNode.connect(audioCtx.destination);

            osc1.start(now);
            osc2.start(now);
            osc1.stop(now + 0.5);
            osc2.stop(now + 0.5);
        }

        function triggerAlarm() {
            if (isAlarmPlaying) return;
            isAlarmPlaying = true;
            playSirenPulse();
            alarmInterval = setInterval(playSirenPulse, 800);
        }

        function stopAlarm() {
            isAlarmPlaying = false;
            clearInterval(alarmInterval);
        }

        minInput.addEventListener('input', () => localStorage.setItem('minRange', minInput.value));
        maxInput.addEventListener('input', () => localStorage.setItem('maxRange', maxInput.value));
        
        window.addEventListener('load', () => {
            if (localStorage.getItem('minRange')) minInput.value = localStorage.getItem('minRange');
            if (localStorage.getItem('maxRange')) maxInput.value = localStorage.getItem('maxRange');
        });
    </script>
</body>
</html>
