<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>RDESK Command | Liquidity Sentinel V9</title>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/5.7.2/ethers.umd.min.js"></script>
    <script src="https://unpkg.com/lightweight-charts@4.2.3/dist/lightweight-charts.standalone.production.js"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;600;700&family=Space+Mono:wght@400;700&display=swap');

        :root {
            --bg-base: #020202; --dekton-copper: #cda434; --dekton-dim: rgba(205, 164, 52, 0.15);
            --danger-red: #ff2a40; --warning-yellow: #ffb703; --success-green: #00ff88;
            --glass-bg: rgba(10, 10, 10, 0.95); --panel-border: rgba(255, 255, 255, 0.05);
            --pos1-color: #00ff88; /* Cor da Posição 1 */
            --pos2-color: #00d4ff; /* Cor da Posição 2 */
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background-color: var(--bg-base); color: #fff; font-family: 'Rajdhani', sans-serif; height: 100vh; padding: 10px; display: flex; flex-direction: column; overflow: hidden; }

        /* ARQUITETURA FLUIDA (Pronta para Tela Dividida) */
        .terminal-grid { 
            display: flex; flex-wrap: wrap; gap: 10px; width: 100%; height: calc(100vh - 60px); 
        }

        .panel { 
            background: var(--glass-bg); border: 1px solid var(--panel-border); border-radius: 6px; 
            display: flex; flex-direction: column; box-shadow: inset 0 0 40px rgba(0,0,0,1); overflow: hidden; 
        }
        .panel-header { font-size: 0.65rem; text-transform: uppercase; letter-spacing: 2px; color: #666; border-bottom: 1px solid rgba(255,255,255,0.03); padding: 8px 12px; display: flex; justify-content: space-between; align-items: center; background: #000; flex-shrink: 0; }
        .highlight-text { color: var(--dekton-copper); font-weight: 700; }

        /* COLUNA 1: VARIAÇÕES (Encolhe inteligentemente) */
        .variations-col { flex: 0 0 220px; display: flex; flex-direction: column; }
        .var-grid { display: flex; flex-direction: column; gap: 4px; padding: 10px; overflow-y: auto; flex-grow: 1; }
        .var-grid::-webkit-scrollbar { width: 3px; } .var-grid::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 3px; }
        .var-card { background: rgba(0, 0, 0, 0.8); border-left: 2px solid rgba(255,255,255,0.05); padding: 6px 10px; border-radius: 4px; display: flex; justify-content: space-between; align-items: center; }
        .var-label { font-size: 0.65rem; color: #777; letter-spacing: 1px; font-weight: 600; }
        .var-value { font-family: 'Space Mono', monospace; font-size: 0.8rem; font-weight: 700; }
        .positive { color: var(--success-green); border-left-color: var(--success-green); background: linear-gradient(90deg, rgba(0,255,136,0.05) 0%, transparent 100%); }
        .negative { color: var(--danger-red); border-left-color: var(--danger-red); background: linear-gradient(90deg, rgba(255,42,64,0.05) 0%, transparent 100%); }

        /* COLUNA 2: GRÁFICO TÁTICO (Ocupa o espaço que sobrar) */
        .tactical-col { flex: 1 1 400px; display: flex; flex-direction: column; min-width: 0; min-height: 0; }
        .chart-header { display: flex; gap: 4px; padding: 6px 10px; background: rgba(0,0,0,0.8); border-bottom: 1px solid rgba(255,255,255,0.03); flex-shrink: 0; flex-wrap: wrap; }
        .tf-btn { background: #000; color: #666; border: 1px solid rgba(255,255,255,0.05); padding: 4px 10px; border-radius: 4px; font-family: 'Space Mono', monospace; font-size: 0.7rem; font-weight: 700; cursor: pointer; transition: all 0.2s; }
        .tf-btn.active { background: var(--dekton-copper); color: #000; border-color: var(--dekton-copper); box-shadow: 0 0 10px rgba(205,164,52,0.4); }
        .chart-wrapper { flex-grow: 1; width: 100%; min-height: 0; position: relative; }

        /* COLUNA 3: COMANDOS E ESTRATÉGIA */
        .cmd-col { flex: 0 0 320px; display: flex; flex-direction: column; gap: 10px; }
        .price-huge { font-family: 'Space Mono', monospace; font-size: 2rem; font-weight: 700; margin: 5px 15px; text-align: center; }
        
        .macro-row { display: flex; justify-content: space-between; padding: 8px 15px; border-bottom: 1px solid rgba(255,255,255,0.03); align-items: center; }
        .macro-label { font-size: 0.75rem; color: #777; font-weight: 600; letter-spacing: 1px; }
        .macro-val { font-family: 'Space Mono', monospace; font-size: 0.85rem; font-weight: 700; display: flex; gap: 8px; align-items: center;}
        
        /* CAIXA DE INTELIGÊNCIA SNIPER */
        .strategy-box { background: rgba(205, 164, 52, 0.05); padding: 12px 15px; border-top: 1px solid var(--dekton-dim); }
        .strat-title { font-size: 0.65rem; color: var(--dekton-copper); letter-spacing: 1px; text-transform: uppercase; margin-bottom: 8px; font-weight: 700;}
        .strat-row { display: flex; justify-content: space-between; font-family: 'Space Mono'; font-size: 0.75rem; color: #aaa; margin-bottom: 4px; align-items: center;}
        .sniper-badge { background: var(--success-green); color: #000; padding: 2px 6px; border-radius: 4px; font-weight: 700; font-size: 0.65rem; }

        /* SCANNER MULTI-POSIÇÕES */
        .wallet-scanner-box { background: rgba(0,0,0,0.5); padding: 12px 15px; border-top: 1px solid rgba(255,255,255,0.05); flex-shrink:0; }
        .wallet-input-group { display: flex; gap: 8px; margin-top: 5px; }
        input[type="text"] { background: #000; border: 1px solid var(--panel-border); color: var(--dekton-copper); font-family: 'Space Mono', monospace; font-size: 0.8rem; padding: 8px; border-radius: 4px; outline: none; width: 100%; }
        input:focus { border-color: var(--dekton-copper); }
        .btn-scan { background: var(--dekton-copper); border: none; padding: 0 12px; border-radius: 4px; color: #000; font-family: 'Rajdhani'; font-weight: 700; cursor: pointer; transition: 0.1s; }
        
        .positions-list { display: flex; flex-direction: column; gap: 6px; margin-top: 10px; }
        .pos-item { display: flex; justify-content: space-between; font-family: 'Space Mono'; font-size: 0.7rem; padding: 6px; background: rgba(255,255,255,0.03); border-radius: 4px; border-left: 3px solid; }

        /* TAPE READING FLUIDO */
        .tape-container { flex-grow: 1; display: flex; flex-direction: column; min-height: 150px; }
        .tape-header { display: grid; grid-template-columns: 55px 50px 1fr 1fr; padding: 8px 15px; border-bottom: 1px solid rgba(255,255,255,0.05); font-size: 0.6rem; text-transform: uppercase; color: #555; font-weight: 700; background: #000; }
        #tape { flex-grow: 1; overflow-y: auto; overflow-x: hidden; padding-bottom: 10px; }
        #tape::-webkit-scrollbar { width: 3px; } #tape::-webkit-scrollbar-thumb { background: rgba(205,164,52,0.3); border-radius: 3px; }
        .tape-row { display: grid; grid-template-columns: 55px 50px 1fr 1fr; padding: 6px 15px; font-family: 'Space Mono', monospace; font-size: 0.7rem; border-bottom: 1px solid rgba(255,255,255,0.02); align-items: center; }
        .type-buy { color: var(--success-green); } .type-sell { color: var(--danger-red); }

        .btn-start { width: 100%; padding: 12px; background: var(--dekton-copper); border: none; border-radius: 4px; color: #000; font-family: 'Rajdhani', sans-serif; font-size: 1rem; font-weight: 700; text-transform: uppercase; letter-spacing: 2px; cursor: pointer; margin-bottom: 10px; flex-shrink: 0; }
        .pulse-dot { display: inline-block; width: 6px; height: 6px; border-radius: 50%; box-shadow: 0 0 10px var(--success-green); animation: ws-pulse 1.5s infinite alternate; margin-right: 5px; }
        @keyframes ws-pulse { 0% { opacity: 0.3; transform: scale(0.8); } 100% { opacity: 1; transform: scale(1.2); } }
        .tick-up { color: var(--success-green) !important; text-shadow: 0 0 20px var(--success-green); }
        .tick-down { color: var(--danger-red) !important; text-shadow: 0 0 20px var(--danger-red); }

        /* REGRAS DE MEDIA QUERIES PARA SPLIT SCREEN */
        @media (max-width: 1100px) {
            .variations-col { flex: 0 0 160px; } /* Afina a barra esquerda */
            .cmd-col { flex: 0 0 280px; } /* Afina a barra direita */
        }
        @media (max-width: 850px) {
            /* Quando a tela for muito dividida, a barra esquerda vai pra baixo */
            .variations-col { flex: 1 1 100%; order: 3; flex-direction: row; height: 100px; }
            .var-grid { flex-direction: row; overflow-x: auto; overflow-y: hidden; }
            .var-card { flex-direction: column; justify-content: center; min-width: 80px; }
            .tactical-col { order: 1; flex: 1 1 300px; height: 50vh; }
            .cmd-col { order: 2; flex: 1 1 300px; height: 50vh; }
        }
    </style>
</head>
<body>

    <button id="btn-init" class="btn-start">INICIAR COCKPIT RDESK V9 (MULTI-POSIÇÕES)</button>

    <div class="terminal-grid">
        
        <!-- COLUNA 1 -->
        <div class="panel variations-col">
            <div class="panel-header"><span><span class="pulse-dot" style="background:#fff"></span> OHLC</span></div>
            <div class="var-grid" id="variations-grid">
                <div style="font-size:0.7rem; color:#444; text-align:center; padding:20px;">Aguardando...</div>
            </div>
        </div>

        <!-- COLUNA 2 -->
        <div class="panel tactical-col">
            <div class="chart-header" id="tf-buttons">
                <button class="tf-btn" data-interval="1m" data-seconds="60">1m</button>
                <button class="tf-btn" data-interval="5m" data-seconds="300">5m</button>
                <button class="tf-btn active" data-interval="15m" data-seconds="900">15m</button>
                <button class="tf-btn" data-interval="1h" data-seconds="3600">1H</button>
                <button class="tf-btn" data-interval="4h" data-seconds="14400">4H</button>
            </div>
            
            <div class="chart-wrapper" id="tv-chart"></div>
        </div>

        <!-- COLUNA 3 -->
        <div class="cmd-col">
            <div class="panel" id="panel-radar">
                <div class="panel-header"><span><span class="pulse-dot" id="global-dot" style="background:var(--success-green)"></span> Radar CEX</span></div>
                
                <div id="price-global" class="price-huge">0.000000</div>
                
                <div class="macro-row"><span class="macro-label">USD / BRL</span><span class="macro-val" id="macro-usd">R$ 0.00</span></div>
                <div class="macro-row"><span class="macro-label">POL / BRL</span><span class="macro-val" id="macro-pol-brl">R$ 0.00</span></div>
                
                <!-- INTELIGÊNCIA SNIPER ($1/MIN) -->
                <div class="strategy-box">
                    <div class="strat-title">Motor Tático: Alta Rotação</div>
                    <div class="strat-row"><span>Macro (24h)</span><span style="color:#fff;" id="strat-macro">...</span></div>
                    <div class="strat-row"><span class="sniper-badge">SNIPER (Micro)</span><span style="color:var(--success-green); font-weight:700;" id="strat-sniper">...</span></div>
                </div>

                <!-- SCANNER MULTI-POSIÇÕES (THE GRAPH) -->
                <div class="wallet-scanner-box">
                    <div style="font-size:0.65rem; color:#888; text-transform:uppercase;">Scanner Multi-Posições V3</div>
                    <div class="wallet-input-group">
                        <input type="text" id="wallet-address" placeholder="Sua Carteira (0x...)">
                        <button id="btn-scan" class="btn-scan">SCAN</button>
                    </div>
                    
                    <div id="positions-list" class="positions-list">
                        <!-- Posições injetadas aqui -->
                    </div>
                </div>
            </div>

            <div class="panel tape-container">
                <div class="panel-header"><span><span class="pulse-dot" id="polygon-dot" style="background:#fff"></span> Scanner DEX</span></div>
                <div class="tape-header"><div>Hora</div><div>Tipo</div><div>BRL</div><div>Qtd (POL)</div></div>
                <div id="tape"></div>
            </div>
        </div>

    </div>

    <script>
        const SYMBOL = 'POLUSDT';
        const POOL_ADDRESS = '0x9B08288C3Be4F62bbf8d1C20Ac9C5e6f9467d8B7'.toLowerCase();
        
        const swapABI = ["event Swap(address indexed sender, address indexed recipient, int256 amount0, int256 amount1, uint160 sqrtPriceX96, uint128 liquidity, int24 tick)"];
        const iface = new ethers.utils.Interface(swapABI);
        const SWAP_TOPIC = iface.getEventTopic("Swap");
        
        let currentPriceGlobal = 0, lastPriceGlobal = 0; 
        let usdBrlRate = 5.80;
        let activePositions = []; // Guarda as múltiplas posições
        
        let chart, candleSeries;
        let positionLines = []; // Guarda as linhas desenhadas no gráfico
        let currentInterval = '15m', currentIntervalSeconds = 900;
        let syntheticCandle = null;

        const priceGlobalEl = document.getElementById('price-global');
        const tapeEl = document.getElementById('tape');
        const btnInit = document.getElementById('btn-init');

        const VAR_INTERVALS = [
            { label: '1 MIN', key: '1m' }, { label: '5 MIN', key: '5m' }, { label: '15 MIN', key: '15m' }, { label: '30 MIN', key: '30m' }, 
            { label: '1 HORA', key: '1h' }, { label: '4 HORAS', key: '4h' }, { label: '8 HORAS', key: '8h' }, { label: '12 HORAS', key: '12h' }, 
            { label: '1 DIA', key: '1d' }, { label: '1 SEM', key: '1w' }, { label: '1 MÊS', key: '1M' }
        ];

        btnInit.addEventListener('click', async () => {
            btnInit.style.display = 'none'; tapeEl.innerHTML = '';
            setTimeout(() => { try { initTradingViewChart(); } catch(e){} }, 0);
            setTimeout(() => { try { buildVariationsPanel(); setInterval(buildVariationsPanel, 60000); } catch(e){} }, 50);
            setTimeout(() => { try { initGlobalTracker(); } catch(e){} }, 100);
            setTimeout(() => { try { initPolygonScanner(); } catch(e){} }, 150);
            setTimeout(() => { try { fetchMacroData(); setInterval(fetchMacroData, 30000); } catch(e){} }, 200);
        });

        // 1. MOTOR GRÁFICO
        function initTradingViewChart() {
            const container = document.getElementById('tv-chart');
            chart = LightweightCharts.createChart(container, {
                width: container.clientWidth,
                height: container.clientHeight,
                layout: { background: { type: 'solid', color: '#020202' }, textColor: '#666' },
                grid: { vertLines: { color: 'rgba(255,255,255,0.02)' }, horzLines: { color: 'rgba(255,255,255,0.02)' } },
                crosshair: { vertLine: { color: '#cda434', style: 3 }, horzLine: { color: '#cda434', style: 3 } },
                timeScale: { timeVisible: true, borderColor: 'rgba(255,255,255,0.05)' },
                rightPriceScale: { borderColor: 'rgba(255,255,255,0.05)' }
            });
            
            candleSeries = chart.addCandlestickSeries({ 
                upColor: '#00ff88', downColor: '#ff2a40', borderVisible: false, 
                wickUpColor: '#00ff88', wickDownColor: '#ff2a40', priceFormat: { type: 'price', precision: 6, minMove: 0.000001 }
            });

            new ResizeObserver(entries => {
                if (entries.length === 0 || entries[0].target !== container) return;
                chart.resize(entries[0].contentRect.width, entries[0].contentRect.height);
            }).observe(container);

            document.querySelectorAll('.tf-btn').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    document.querySelectorAll('.tf-btn').forEach(b => b.classList.remove('active')); e.target.classList.add('active');
                    currentInterval = e.target.getAttribute('data-interval'); currentIntervalSeconds = parseInt(e.target.getAttribute('data-seconds'));
                    syntheticCandle = null; loadChartHistory(currentInterval);
                });
            });
            loadChartHistory(currentInterval);
        }

        async function loadChartHistory(interval) {
            try {
                const res = await fetch(`https://api.binance.com/api/v3/klines?symbol=${SYMBOL}&interval=${interval}&limit=200`);
                if(!res.ok) throw new Error("API Block");
                const data = await res.json();
                const klines = data.map(d => ({ time: Math.floor(d[0]/1000), open: parseFloat(d[1]), high: parseFloat(d[2]), low: parseFloat(d[3]), close: parseFloat(d[4]) }));
                candleSeries.setData(klines);
                updateAIStrategyEngine(klines); // Aciona o cálculo Sniper
                drawMultiplePositionLines();
            } catch (e) { candleSeries.setData([]); }
        }

        function updateLiveCandle(price) {
            if (!candleSeries || price === 0) return;
            const nowSec = Math.floor(Date.now() / 1000); const blockTime = Math.floor(nowSec / currentIntervalSeconds) * currentIntervalSeconds;
            if (!syntheticCandle || syntheticCandle.time !== blockTime) { syntheticCandle = { time: blockTime, open: price, high: price, low: price, close: price }; } 
            else { syntheticCandle.high = Math.max(syntheticCandle.high, price); syntheticCandle.low = Math.min(syntheticCandle.low, price); syntheticCandle.close = price; }
            candleSeries.update(syntheticCandle);
        }

        // 2. INTELIGÊNCIA ARTIFICIAL: TÁTICA SNIPER (Volatilidade)
        function updateAIStrategyEngine(klines) {
            if(klines.length < 50) return;
            
            // Macro 24h (Aproximadamente 96 velas de 15m)
            const recentMacro = klines.slice(-96); 
            let maxHigh = 0, minLow = Infinity;
            recentMacro.forEach(k => { maxHigh = Math.max(maxHigh, k.high); minLow = Math.min(minLow, k.low); });
            document.getElementById('strat-macro').innerText = `${minLow.toFixed(5)} <> ${maxHigh.toFixed(5)}`;

            // Sniper (Volatilidade Recente - Últimas 20 Velas)
            const recentMicro = klines.slice(-20);
            let sum = 0;
            recentMicro.forEach(k => sum += k.close);
            const avg = sum / recentMicro.length;
            
            // Cálculo do Desvio Padrão
            let variance = 0;
            recentMicro.forEach(k => variance += Math.pow(k.close - avg, 2));
            const stdDev = Math.sqrt(variance / recentMicro.length);

            // A Tática Sniper cria um túnel estreitíssimo baseado em 1.2x o Desvio Padrão
            const sniperMin = avg - (stdDev * 1.2);
            const sniperMax = avg + (stdDev * 1.2);
            
            document.getElementById('strat-sniper').innerText = `${sniperMin.toFixed(5)} <> ${sniperMax.toFixed(5)}`;
        }


        // 3. SCANNER THE GRAPH (MULTI-POSIÇÕES)
        const btnScan = document.getElementById('btn-scan');
        const walletInput = document.getElementById('wallet-address');

        btnScan.addEventListener('click', async () => {
            const address = walletInput.value.trim().toLowerCase();
            if(!ethers.utils.isAddress(address)) return;
            
            btnScan.innerText = "...";
            try {
                // Requisição The Graph buscando as 5 últimas posições com liquidez na Pool
                const query = `
                {
                  positions(where: { owner: "${address}", pool: "${POOL_ADDRESS}", liquidity_gt: "0" }, orderBy: transaction__timestamp, orderDirection: desc, first: 5) {
                    id
                    tickLower { tickIdx }
                    tickUpper { tickIdx }
                    liquidity
                    token0 { symbol, decimals }
                  }
                }`;

                const response = await fetch("https://api.thegraph.com/subgraphs/name/ianlapham/uniswap-v3-polygon", {
                    method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ query })
                });

                const json = await response.json();
                activePositions = json.data.positions;

                const listEl = document.getElementById('positions-list');
                listEl.innerHTML = '';
                positionLines.forEach(l => candleSeries.removePriceLine(l));
                positionLines = [];

                if(activePositions.length > 0) {
                    // Mapeia e desenha as posições na tela
                    activePositions.forEach((pos, index) => {
                        const tLower = parseInt(pos.tickLower.tickIdx);
                        const tUpper = parseInt(pos.tickUpper.tickIdx);
                        
                        let calcMin = Math.pow(1.0001, tLower) * 1e-12;
                        let calcMax = Math.pow(1.0001, tUpper) * 1e-12;
                        
                        // Determina se a posição é apertada ou larga visualmente
                        const amplitude = calcMax - calcMin;
                        const isTight = amplitude < 0.003; 
                        const colorCode = isTight ? 'var(--pos1-color)' : 'var(--pos2-color)';
                        const typeName = isTight ? 'Apertada' : 'Ampla';

                        // Insere no Painel
                        listEl.innerHTML += `
                            <div class="pos-item" style="border-color: ${colorCode};">
                                <span style="color: ${colorCode}; font-weight:700;">[#${index+1} ${typeName}]</span>
                                <span>${calcMin.toFixed(5)} <> ${calcMax.toFixed(5)}</span>
                            </div>
                        `;

                        // Desenha as Linhas no Gráfico Simultaneamente
                        if(candleSeries) {
                            positionLines.push(candleSeries.createPriceLine({ price: calcMin, color: colorCode, lineWidth: 2, lineStyle: 2, axisLabelVisible: true, title: `MIN ${index+1}` }));
                            positionLines.push(candleSeries.createPriceLine({ price: calcMax, color: colorCode, lineWidth: 2, lineStyle: 2, axisLabelVisible: true, title: `MAX ${index+1}` }));
                        }
                    });
                    localStorage.setItem('savedWallet', address);
                } else {
                    listEl.innerHTML = '<div style="color:var(--danger-red); font-size:0.7rem;">Nenhuma liquidez ativa encontrada.</div>';
                }
            } catch(e) {
                console.error("The Graph Erro:", e);
            }
            btnScan.innerText = "SCAN";
        });

        function drawMultiplePositionLines() {
            // Caso o gráfico reinicie (troca de tempo), redesenha as posições que estão na memória
            if(activePositions.length > 0) btnScan.click(); 
        }

        // 4. RASTREADORES E MACRO
        async function buildVariationsPanel() {
            const grid = document.getElementById('variations-grid'); let html = '';
            for (let v of VAR_INTERVALS) {
                try {
                    const res = await fetch(`https://api.binance.com/api/v3/klines?symbol=${SYMBOL}&interval=${v.key}&limit=2`);
                    const data = await res.json();
                    if(data && data.length > 0) {
                        const current = parseFloat(data[data.length-1][4]); const old = parseFloat(data[0][1]); 
                        const perc = ((current - old) / old) * 100; const isPos = perc >= 0;
                        html += `<div class="var-card ${isPos ? 'positive' : 'negative'}"><span class="var-label">${v.label}</span><span class="var-value">${isPos ? '+' : ''}${perc.toFixed(2)}%</span></div>`;
                    }
                } catch(e) {}
            }
            grid.innerHTML = html;
        }

        function initGlobalTracker() {
            const ws = new WebSocket(`wss://stream.binance.com:9443/ws/${SYMBOL.toLowerCase()}@ticker`);
            ws.onmessage = (event) => {
                const newPrice = parseFloat(JSON.parse(event.data).c);
                if (lastPriceGlobal !== 0 && newPrice !== lastPriceGlobal) {
                    priceGlobalEl.classList.remove('tick-up', 'tick-down'); void priceGlobalEl.offsetWidth; 
                    priceGlobalEl.classList.add(newPrice > lastPriceGlobal ? 'tick-up' : 'tick-down');
                }
                lastPriceGlobal = newPrice; currentPriceGlobal = newPrice;
                priceGlobalEl.innerText = currentPriceGlobal.toFixed(6);
                if(usdBrlRate > 0) document.getElementById('macro-pol-brl').innerText = `R$ ${(currentPriceGlobal * usdBrlRate).toFixed(4)}`;
                updateLiveCandle(currentPriceGlobal);
            };
            ws.onclose = () => setTimeout(initGlobalTracker, 2000);
        }

        function initPolygonScanner() {
            const wsPool = new WebSocket('wss://polygon-bor-rpc.publicnode.com');
            wsPool.onopen = () => { wsPool.send(JSON.stringify({ "jsonrpc": "2.0", "id": 1, "method": "eth_subscribe", "params": ["logs", { "address": POOL_ADDRESS }] })); };
            wsPool.onmessage = (event) => {
                const response = JSON.parse(event.data);
                if (response.method === 'eth_subscription' && response.params.result.topics[0] === SWAP_TOPIC) {
                    try {
                        const parsed = iface.parseLog(response.params.result);
                        const amount0 = parseFloat(ethers.utils.formatUnits(parsed.args.amount0.toString(), 18));
                        const amount1 = parseFloat(ethers.utils.formatUnits(parsed.args.amount1.toString(), 6));
                        
                        const isBuy = amount0 < 0;
                        const polVal = Math.abs(amount0).toLocaleString('pt-BR', {minimumFractionDigits:0, maximumFractionDigits: 1});
                        const brlVal = (Math.abs(amount1) * usdBrlRate).toLocaleString('pt-BR', {style: 'currency', currency: 'BRL', maximumFractionDigits: 0});
                        const time = new Date().toLocaleTimeString('pt-BR', { hour12: false });
                        
                        const row = document.createElement('div'); row.className = 'tape-row new-tx';
                        row.innerHTML = `<div>${time}</div><div class="${isBuy ? 'type-buy' : 'type-sell'}">${isBuy ? 'COMPRA' : 'VENDA'}</div><div>${brlVal}</div><div>${polVal} P</div>`;
                        tapeEl.prepend(row);
                        if(tapeEl.children.length > 25) tapeEl.removeChild(tapeEl.lastChild); 
                    } catch (error) {}
                }
            };
            wsPool.onclose = () => setTimeout(initPolygonScanner, 3000);
        }

        async function fetchMacroData() {
            try { 
                const resBRL = await fetch('https://economia.awesomeapi.com.br/last/USD-BRL'); 
                usdBrlRate = parseFloat((await resBRL.json()).USDBRL.ask); 
                document.getElementById('macro-usd').innerText = `R$ ${usdBrlRate.toFixed(4)}`;
            } catch(e){}
        }

        window.addEventListener('load', () => { 
            const savedWallet = localStorage.getItem('savedWallet');
            if(savedWallet) { walletInput.value = savedWallet; btnScan.click(); }
        });
    </script>
</body>
