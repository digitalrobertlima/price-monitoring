<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>RDESK Terminal | Wall Street de Bolso</title>
    
    <!-- Decodificador Blockchain -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/5.7.2/ethers.umd.min.js"></script>
    <!-- Motor Gráfico de Alta Frequência (TradingView) -->
    <script src="https://unpkg.com/lightweight-charts/dist/lightweight-charts.standalone.production.js"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;600;700&family=Space+Mono:wght@400;700&display=swap');

        :root {
            --bg-base: #070707;
            --dekton-copper: #cda434;
            --dekton-dark: #b8912d;
            --danger-red: #ff3366;
            --success-green: #00ff88;
            --glass-bg: rgba(15, 14, 14, 0.75);
            --panel-border: rgba(205, 164, 52, 0.15);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background-color: var(--bg-base);
            background-image: 
                radial-gradient(circle at 10% 20%, rgba(205, 164, 52, 0.05), transparent 40%),
                radial-gradient(circle at 90% 80%, rgba(0, 255, 255, 0.02), transparent 40%);
            color: #fff;
            font-family: 'Rajdhani', sans-serif;
            min-height: 100vh;
            padding: 10px;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
        }

        /* GRID PRINCIPAL */
        .terminal-grid {
            display: grid;
            grid-template-columns: 1fr 1fr 1.6fr;
            gap: 12px;
            width: 100%;
            max-width: 1600px;
            margin: 0 auto;
            flex-grow: 1;
        }

        /* PAINEL GRÁFICO (TRADINGVIEW) Ocupa o topo inteiro */
        .chart-panel {
            grid-column: 1 / -1;
            background: var(--glass-bg);
            border: 1px solid var(--panel-border);
            border-radius: 12px;
            padding: 15px;
            display: flex;
            flex-direction: column;
            height: 50vh; /* Altura ideal para mobile e desktop */
            min-height: 350px;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.8);
        }

        .chart-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
            flex-wrap: wrap;
            gap: 10px;
        }

        .chart-title { font-size: 1rem; text-transform: uppercase; letter-spacing: 2px; color: #888; font-weight: 700; }
        .chart-title span { color: var(--dekton-copper); }

        .timeframe-selector {
            display: flex; gap: 5px; background: rgba(0,0,0,0.5); padding: 4px; border-radius: 6px; border: 1px solid rgba(255,255,255,0.05);
        }

        .tf-btn {
            background: transparent; color: #888; border: none; padding: 6px 12px; border-radius: 4px;
            font-family: 'Space Mono', monospace; font-size: 0.8rem; font-weight: 700; cursor: pointer; transition: all 0.2s;
        }
        
        .tf-btn.active { background: rgba(205, 164, 52, 0.2); color: var(--dekton-copper); }
        .tf-btn:hover:not(.active) { color: #fff; }

        .chart-container { flex-grow: 1; width: 100%; position: relative; }

        /* PAINÉIS DE DADOS */
        .panel {
            background: var(--glass-bg); border: 1px solid var(--panel-border); border-radius: 12px;
            padding: 15px; display: flex; flex-direction: column; box-shadow: inset 0 0 20px rgba(0,0,0,0.8);
        }

        .panel-header {
            font-size: 0.8rem; text-transform: uppercase; letter-spacing: 2px; color: #888;
            border-bottom: 1px solid rgba(255,255,255,0.05); padding-bottom: 8px; margin-bottom: 12px;
            display: flex; justify-content: space-between; align-items: center;
        }

        .highlight-text { color: var(--dekton-copper); font-weight: 700; }

        .price-huge { font-family: 'Space Mono', monospace; font-size: 2.2rem; font-weight: 700; margin: 5px 0; transition: color 0.1s; }

        .data-row {
            display: flex; justify-content: space-between; font-family: 'Space Mono', monospace;
            font-size: 0.85rem; padding: 6px 0; border-bottom: 1px dashed rgba(255,255,255,0.1);
        }
        .data-label { font-family: 'Rajdhani', sans-serif; color: #aaa; text-transform: uppercase; letter-spacing: 1px; }

        /* TAPE READING (MOBILE OTIMIZADO) */
        .tape-container { flex-grow: 1; background: #0a0a0a; border-radius: 6px; overflow: hidden; display: flex; flex-direction: column; }
        .tape-header {
            display: grid; grid-template-columns: 60px 80px 1fr 1fr 1fr 90px; padding: 10px;
            border-bottom: 1px solid rgba(255,255,255,0.1); font-size: 0.7rem; text-transform: uppercase; color: #888; font-weight: 700;
        }
        .tape-row {
            display: grid; grid-template-columns: 60px 80px 1fr 1fr 1fr 90px; padding: 8px 10px;
            font-family: 'Space Mono', monospace; font-size: 0.75rem; border-bottom: 1px solid rgba(255,255,255,0.02);
            align-items: center; animation: slide-down 0.3s ease-out forwards;
        }
        .tape-row.new-tx { background: rgba(205, 164, 52, 0.15); }
        .type-buy { color: var(--success-green); }
        .type-sell { color: var(--danger-red); }
        .wallet-hash { color: #aaa; font-size: 0.65rem; }

        @keyframes slide-down { 0% { opacity: 0; transform: translateY(-10px); background: rgba(205,164,52,0.3); } 100% { opacity: 1; transform: translateY(0); } }

        /* CONTROLES */
        .controls { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 10px;}
        input {
            background: rgba(0,0,0,0.8); border: 1px solid var(--panel-border); color: var(--dekton-copper);
            font-family: 'Space Mono', monospace; font-size: 1rem; padding: 8px; border-radius: 6px; text-align: center; width: 100%; outline: none;
        }
        input:focus { border-color: var(--dekton-copper); }
        
        .spread-box { background: rgba(0,0,0,0.5); padding: 12px; border-radius: 8px; text-align: center; margin-top: 10px; border: 1px solid rgba(255,255,255,0.05); }

        .btn-start {
            width: 100%; padding: 15px; background: linear-gradient(45deg, var(--dekton-copper), #e6b93e);
            border: none; border-radius: 8px; color: #000; font-family: 'Rajdhani', sans-serif;
            font-size: 1.1rem; font-weight: 700; text-transform: uppercase; letter-spacing: 2px;
            cursor: pointer; margin-bottom: 12px; box-shadow: 0 4px 15px rgba(205,164,52,0.3); position: sticky; top: 10px; z-index: 100;
        }

        .pulse-dot {
            display: inline-block; width: 6px; height: 6px; border-radius: 50%;
            background-color: var(--success-green); box-shadow: 0 0 10px var(--success-green);
            animation: ws-pulse 1.5s infinite alternate; margin-right: 5px;
        }
        @keyframes ws-pulse { 0% { opacity: 0.3; transform: scale(0.8); } 100% { opacity: 1; transform: scale(1.2); } }

        .tick-up { color: var(--success-green); text-shadow: 0 0 20px var(--success-green); }
        .tick-down { color: var(--danger-red); text-shadow: 0 0 20px var(--danger-red); }

        body.alert-mode .panel:first-child { border-color: var(--danger-red); animation: pulse-danger 1s infinite alternate; }
        @keyframes pulse-danger { 0% { box-shadow: inset 0 0 20px rgba(255,42,42,0.1); } 100% { box-shadow: inset 0 0 60px rgba(255,42,42,0.4); } }

        /* RESPONSIVIDADE MOBILE ABSOLUTA */
        @media (max-width: 950px) {
            .terminal-grid { grid-template-columns: 1fr; }
            .chart-panel { height: 45vh; min-height: 300px; }
            .tape-header, .tape-row {
                /* No celular, encolhe colunas e prioriza Valores, Tipo e BRL */
                grid-template-columns: 50px 70px 1fr 1fr 1fr;
                font-size: 0.65rem;
                gap: 5px;
            }
            .tape-header div:last-child, .tape-row div:last-child { display: none; } /* Esconde a Hash da carteira no celular para não amassar a tabela */
        }
    </style>
</head>
<body>

    <button id="btn-init" class="btn-start">Acionar Terminal Wall Street</button>

    <div class="terminal-grid">
        
        <!-- NOVO: COCKPIT GRÁFICO (TRADINGVIEW) -->
        <div class="chart-panel">
            <div class="chart-header">
                <div class="chart-title"><span class="pulse-dot" style="background:#fff; box-shadow:0 0 10px #fff"></span> POL/USDT <span>LIVE TACTICAL VIEW</span></div>
                <div class="timeframe-selector" id="tf-buttons">
                    <button class="tf-btn" data-interval="1m">1m</button>
                    <button class="tf-btn" data-interval="5m">5m</button>
                    <button class="tf-btn active" data-interval="15m">15m</button>
                    <button class="tf-btn" data-interval="1h">1H</button>
                    <button class="tf-btn" data-interval="4h">4H</button>
                    <button class="tf-btn" data-interval="1d">1D</button>
                </div>
            </div>
            <div id="tv-chart" class="chart-container"></div>
        </div>
        
        <!-- PAINEL GLOBAL (Controles) -->
        <div class="panel">
            <div class="panel-header">
                <span><span class="pulse-dot"></span> Binance Tracker</span>
                <span class="highlight-text" id="alert-status">SEGURO</span>
            </div>
            <div id="price-binance" class="price-huge">0.0000</div>
            
            <div class="controls">
                <div><div class="data-label" style="font-size:0.65rem;">Mínima (Liquidez)</div><input type="number" id="min-price" step="0.0001"></div>
                <div><div class="data-label" style="font-size:0.65rem;">Máxima (Liquidez)</div><input type="number" id="max-price" step="0.0001"></div>
            </div>
        </div>

        <!-- PAINEL LOCAL (Uniswap) -->
        <div class="panel">
            <div class="panel-header">
                <span><span class="pulse-dot" style="background:var(--dekton-copper)"></span> Uniswap V3 Pool</span>
                <span class="highlight-text">EXATO</span>
            </div>
            <div id="price-uniswap" class="price-huge" style="color: var(--dekton-copper);">0.0000</div>
            
            <div class="spread-box">
                <div class="data-label" style="font-size:0.7rem;">Arbitragem (Spread)</div>
                <div id="spread-value" style="font-family: 'Space Mono'; font-size: 1.2rem; font-weight: 700;">0.00%</div>
            </div>

            <div style="margin-top: 10px;">
                <div class="data-row"><span class="data-label">BRL Oracle</span><span id="brl-rate">R$ 0,00</span></div>
                <div class="data-row"><span class="data-label">TVL (Liquidez)</span><span id="uni-liq">$0.00</span></div>
            </div>
        </div>

        <!-- LIVE TAPE (Blockchain) -->
        <div class="panel">
            <div class="panel-header">
                <span><span class="pulse-dot" style="background:#fff"></span> Scanner Ethers.js</span>
                <span class="highlight-text">POLYGON</span>
            </div>
            <div class="tape-container">
                <div class="tape-header">
                    <div>Hora</div><div>Tipo</div><div>BRL</div><div>POL</div><div>USDT</div><div class="hide-mobile">Wallet</div>
                </div>
                <div id="tape" style="display: flex; flex-direction: column;">
                    <div style="padding: 15px; text-align: center; color: #555; font-family: 'Space Mono'; font-size: 0.75rem;">
                        [ AGUARDANDO DECODIFICAÇÃO ]
                    </div>
                </div>
            </div>
        </div>

    </div>

    <script>
        const SYMBOL = 'POLUSDT';
        const POOL_ADDRESS = '0x9B08288C3Be4F62bbf8d1C20Ac9C5e6f9467d8B7';
        
        // ETHERS.JS Setup
        const swapABI = ["event Swap(address indexed sender, address indexed recipient, int256 amount0, int256 amount1, uint160 sqrtPriceX96, uint128 liquidity, int24 tick)"];
        const iface = new ethers.utils.Interface(swapABI);
        const SWAP_TOPIC = iface.getEventTopic("Swap");
        
        let currentPriceBinance = 0, lastPriceBinance = 0, currentPriceUniswap = 0, usdBrlRate = 5.80;
        let audioCtx = null, isAlarmPlaying = false, alarmInterval = null, firstSwapDetected = false;

        // TRADINGVIEW Setup
        let chart, candleSeries;
        let currentInterval = '15m';
        let klineWebSocket = null;

        const priceBinanceEl = document.getElementById('price-binance');
        const priceUniswapEl = document.getElementById('price-uniswap');
        const spreadEl = document.getElementById('spread-value');
        const tapeEl = document.getElementById('tape');
        const alertStatusEl = document.getElementById('alert-status');
        const bodyEl = document.body;
        const btnInit = document.getElementById('btn-init');

        // INICIALIZAÇÃO GERAL
        btnInit.addEventListener('click', async () => {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            if (audioCtx.state === 'suspended') await audioCtx.resume();
            
            btnInit.style.display = 'none';
            alertStatusEl.innerText = "SEGURO";
            alertStatusEl.style.color = 'var(--success-green)';
            
            initTradingViewChart();
            fetchBRLRate();
            setInterval(fetchBRLRate, 300000);
            
            initBinanceWebSocket();
            initPolygonWebSocket();
            fetchUniswapData();
            setInterval(fetchUniswapData, 10000);
        });

        // 1. MOTOR GRÁFICO (LIGHTWEIGHT CHARTS)
        function initTradingViewChart() {
            const chartContainer = document.getElementById('tv-chart');
            
            chart = LightweightCharts.createChart(chartContainer, {
                layout: { background: { type: 'solid', color: 'transparent' }, textColor: '#888' },
                grid: { vertLines: { color: 'rgba(255,255,255,0.03)' }, horzLines: { color: 'rgba(255,255,255,0.03)' } },
                crosshair: { mode: LightweightCharts.CrosshairMode.Normal, vertLine: { color: '#cda434', style: 3 }, horzLine: { color: '#cda434', style: 3 } },
                rightPriceScale: { borderColor: 'rgba(255,255,255,0.1)' },
                timeScale: { borderColor: 'rgba(255,255,255,0.1)', timeVisible: true, secondsVisible: false },
            });

            candleSeries = chart.addCandlestickSeries({
                upColor: '#00ff88', downColor: '#ff3366', borderVisible: false,
                wickUpColor: '#00ff88', wickDownColor: '#ff3366'
            });

            // Responsividade para redimensionar o gráfico automaticamente ao girar o celular
            new ResizeObserver(entries => {
                if (entries.length === 0 || entries[0].target !== chartContainer) { return; }
                const newRect = entries[0].contentRect;
                chart.applyOptions({ height: newRect.height, width: newRect.width });
            }).observe(chartContainer);

            loadChartData(currentInterval);

            // Controles de Tempo (Touch & Click)
            document.querySelectorAll('.tf-btn').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    document.querySelectorAll('.tf-btn').forEach(b => b.classList.remove('active'));
                    e.target.classList.add('active');
                    currentInterval = e.target.getAttribute('data-interval');
                    loadChartData(currentInterval);
                });
            });
        }

        async function loadChartData(interval) {
            // 1. Busca passado (REST API)
            try {
                const res = await fetch(`https://api.binance.com/api/v3/klines?symbol=${SYMBOL}&interval=${interval}&limit=500`);
                const data = await res.json();
                const klines = data.map(d => ({
                    time: Math.floor(d[0] / 1000), // Converte ms para segundos pro TradingView
                    open: parseFloat(d[1]), high: parseFloat(d[2]), low: parseFloat(d[3]), close: parseFloat(d[4])
                }));
                candleSeries.setData(klines);
            } catch (e) { console.error("Erro ao buscar histórico", e); }

            // 2. Conecta Futuro/Presente (WebSocket da Vela Específica)
            if (klineWebSocket) klineWebSocket.close();
            klineWebSocket = new WebSocket(`wss://stream.binance.com:9443/ws/${SYMBOL.toLowerCase()}@kline_${interval}`);
            klineWebSocket.onmessage = (event) => {
                const msg = JSON.parse(event.data);
                const k = msg.k;
                candleSeries.update({
                    time: Math.floor(k.t / 1000),
                    open: parseFloat(k.o), high: parseFloat(k.h), low: parseFloat(k.l), close: parseFloat(k.c)
                });
            };
        }

        // =====================================
        // ROTINAS DE DADOS (RESTO DO SISTEMA)
        // =====================================
        async function fetchBRLRate() {
            try {
                const res = await fetch('https://economia.awesomeapi.com.br/last/USD-BRL');
                const data = await res.json();
                usdBrlRate = parseFloat(data.USDBRL.ask);
                document.getElementById('brl-rate').innerText = `R$ ${usdBrlRate.toFixed(4).replace('.',',')}`;
            } catch(e) {}
        }

        function initBinanceWebSocket() {
            const ws = new WebSocket(`wss://stream.binance.com:9443/ws/${SYMBOL.toLowerCase()}@ticker`);
            ws.onmessage = (event) => {
                const data = JSON.parse(event.data);
                const newPrice = parseFloat(data.c);
                if (lastPriceBinance !== 0 && newPrice !== lastPriceBinance) {
                    priceBinanceEl.classList.remove('tick-up', 'tick-down');
                    void priceBinanceEl.offsetWidth; 
                    const isUp = newPrice > lastPriceBinance;
                    priceBinanceEl.classList.add(isUp ? 'tick-up' : 'tick-down');
                    playAudioTone(isUp ? 'tick-up' : 'tick-down');
                }
                lastPriceBinance = newPrice;
                currentPriceBinance = newPrice;
                priceBinanceEl.innerText = currentPriceBinance.toFixed(4);
                updateSpread();
                checkLiquidityRange();
            };
            ws.onclose = () => setTimeout(initBinanceWebSocket, 2000);
        }

        async function fetchUniswapData() {
            try {
                const res = await fetch(`https://api.dexscreener.com/latest/dex/pairs/polygon/${POOL_ADDRESS}`);
                const json = await res.json();
                const pair = json.pairs[0];
                if(pair) {
                    currentPriceUniswap = parseFloat(pair.priceUsd);
                    priceUniswapEl.innerText = currentPriceUniswap.toFixed(4);
                    document.getElementById('uni-liq').innerText = `$${parseFloat(pair.liquidity.usd).toLocaleString('en-US')}`;
                    updateSpread();
                }
            } catch (e) {}
        }

        function updateSpread() {
            if(currentPriceBinance > 0 && currentPriceUniswap > 0) {
                const spread = ((currentPriceUniswap - currentPriceBinance) / currentPriceBinance) * 100;
                spreadEl.innerText = `${spread > 0 ? '+' : ''}${spread.toFixed(3)}%`;
                spreadEl.style.color = Math.abs(spread) > 0.2 ? 'var(--dekton-copper)' : '#fff';
            }
        }

        // SCANNER ETHERS.JS (TAPE READING)
        function initPolygonWebSocket() {
            const wsPool = new WebSocket('wss://polygon-bor-rpc.publicnode.com');
            wsPool.onopen = () => { wsPool.send(JSON.stringify({ "jsonrpc": "2.0", "id": 1, "method": "eth_subscribe", "params": ["logs", { "address": POOL_ADDRESS }] })); };
            wsPool.onmessage = (event) => {
                const response = JSON.parse(event.data);
                if (response.method === 'eth_subscription' && response.params.result.topics[0] === SWAP_TOPIC) {
                    if(!firstSwapDetected) { tapeEl.innerHTML = ''; firstSwapDetected = true; }
                    playAudioTone('pool-event');
                    try {
                        const log = response.params.result;
                        const parsed = iface.parseLog(log);
                        const amount0 = parseFloat(ethers.utils.formatUnits(parsed.args.amount0.toString(), 18));
                        const amount1 = parseFloat(ethers.utils.formatUnits(parsed.args.amount1.toString(), 6));
                        
                        const isBuy = amount0 < 0;
                        const tipo = isBuy ? 'COMPRAR' : 'VENDER';
                        const tipoClass = isBuy ? 'type-buy' : 'type-sell';
                        
                        const polVal = Math.abs(amount0).toLocaleString('pt-BR', {maximumFractionDigits: 1});
                        const usdtVal = Math.abs(amount1).toLocaleString('pt-BR', {maximumFractionDigits: 2});
                        const brlVal = (Math.abs(amount1) * usdBrlRate).toLocaleString('pt-BR', {style: 'currency', currency: 'BRL'});
                        
                        const recipient = parsed.args.recipient;
                        const carteira = `${recipient.substring(0,4)}..${recipient.substring(40)}`;
                        const time = new Date().toLocaleTimeString('pt-BR', { hour12: false });
                        
                        const row = document.createElement('div');
                        row.className = 'tape-row new-tx';
                        row.innerHTML = `
                            <div>${time}</div>
                            <div class="${tipoClass}">${tipo}</div>
                            <div>${brlVal}</div>
                            <div>${polVal}</div>
                            <div>${usdtVal}</div>
                            <div class="wallet-hash hide-mobile">${carteira}</div>
                        `;
                        
                        tapeEl.prepend(row);
                        setTimeout(() => { row.classList.remove('new-tx'); }, 1500);
                        if(tapeEl.children.length > 20) { tapeEl.removeChild(tapeEl.lastChild); }
                        fetchUniswapData(); 
                    } catch (error) {}
                }
            };
            wsPool.onclose = () => setTimeout(initPolygonWebSocket, 3000);
        }

        // SEGURANÇA E ÁUDIO
        const minInput = document.getElementById('min-price');
        const maxInput = document.getElementById('max-price');
        
        function checkLiquidityRange() {
            const min = parseFloat(minInput.value); const max = parseFloat(maxInput.value);
            if (isNaN(min) || isNaN(max)) return;
            if (currentPriceBinance < min || currentPriceBinance > max) {
                if (!bodyEl.classList.contains('alert-mode')) {
                    bodyEl.classList.add('alert-mode'); alertStatusEl.innerText = "RISCO IMINENTE"; alertStatusEl.style.color = 'var(--danger-red)'; triggerAlarm();
                }
            } else {
                if (bodyEl.classList.contains('alert-mode')) {
                    bodyEl.classList.remove('alert-mode'); alertStatusEl.innerText = "SEGURO"; alertStatusEl.style.color = 'var(--success-green)'; stopAlarm();
                }
            }
        }

        function playAudioTone(type) {
            if (!audioCtx || isAlarmPlaying) return;
            const osc = audioCtx.createOscillator(); const gain = audioCtx.createGain(); const now = audioCtx.currentTime;
            if (type === 'tick-up') {
                osc.type = 'sine'; osc.frequency.setValueAtTime(800, now); osc.frequency.exponentialRampToValueAtTime(1200, now + 0.1);
                gain.gain.setValueAtTime(0, now); gain.gain.linearRampToValueAtTime(0.15, now + 0.02); gain.gain.exponentialRampToValueAtTime(0.001, now + 0.1);
            } else if (type === 'tick-down') {
                osc.type = 'sine'; osc.frequency.setValueAtTime(400, now); osc.frequency.exponentialRampToValueAtTime(250, now + 0.1);
                gain.gain.setValueAtTime(0, now); gain.gain.linearRampToValueAtTime(0.15, now + 0.02); gain.gain.exponentialRampToValueAtTime(0.001, now + 0.1);
            } else if (type === 'pool-event') {
                osc.type = 'triangle'; osc.frequency.setValueAtTime(2000, now); osc.frequency.exponentialRampToValueAtTime(4000, now + 0.1);
                gain.gain.setValueAtTime(0, now); gain.gain.linearRampToValueAtTime(0.4, now + 0.02); gain.gain.exponentialRampToValueAtTime(0.001, now + 0.3);
            }
            osc.connect(gain); gain.connect(audioCtx.destination); osc.start(now); osc.stop(now + 0.3);
        }

        function playSirenPulse() {
            if (!audioCtx) return;
            const osc1 = audioCtx.createOscillator(); const osc2 = audioCtx.createOscillator(); const gainNode = audioCtx.createGain();
            const now = audioCtx.currentTime;
            osc1.type = 'sawtooth'; osc2.type = 'square';
            osc1.frequency.setValueAtTime(110, now); osc1.frequency.exponentialRampToValueAtTime(440, now + 0.4);
            osc2.frequency.setValueAtTime(220, now); osc2.frequency.exponentialRampToValueAtTime(880, now + 0.4);
            gainNode.gain.setValueAtTime(0, now); gain.gain.linearRampToValueAtTime(0.3, now + 0.1); gainNode.gain.exponentialRampToValueAtTime(0.01, now + 0.5);
            osc1.connect(gainNode); osc2.connect(gainNode); gainNode.connect(audioCtx.destination);
            osc1.start(now); osc2.start(now); osc1.stop(now + 0.5); osc2.stop(now + 0.5);
        }

        function triggerAlarm() { if (!isAlarmPlaying) { isAlarmPlaying = true; playSirenPulse(); alarmInterval = setInterval(playSirenPulse, 800); } }
        function stopAlarm() { isAlarmPlaying = false; clearInterval(alarmInterval); }

        minInput.addEventListener('input', () => localStorage.setItem('minRange', minInput.value));
        maxInput.addEventListener('input', () => localStorage.setItem('maxRange', maxInput.value));
        window.addEventListener('load', () => {
            if (localStorage.getItem('minRange')) minInput.value = localStorage.getItem('minRange');
            if (localStorage.getItem('maxRange')) maxInput.value = localStorage.getItem('maxRange');
        });
    </script>
</body>
</html>
