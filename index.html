<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>RDESK Terminal | Sentinel V5</title>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/5.7.2/ethers.umd.min.js"></script>
    <script src="https://unpkg.com/lightweight-charts/dist/lightweight-charts.standalone.production.js"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;600;700&family=Space+Mono:wght@400;700&display=swap');

        :root {
            --bg-base: #050505; --dekton-copper: #cda434; 
            --danger-red: #ff2a40; --warning-yellow: #ffb703; --success-green: #00ff88;
            --glass-bg: rgba(12, 12, 12, 0.85); --panel-border: rgba(205, 164, 52, 0.2);
            --neon-glow: 0 0 15px rgba(205, 164, 52, 0.3);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { 
            background-color: var(--bg-base); 
            background-image: radial-gradient(circle at 50% 0%, rgba(205, 164, 52, 0.05), transparent 60%);
            color: #fff; font-family: 'Rajdhani', sans-serif; 
            min-height: 100vh; padding: 12px; display: flex; flex-direction: column; overflow-x: hidden;
        }

        .terminal-grid { 
            display: grid; 
            grid-template-columns: 260px 1fr 320px; 
            grid-template-rows: auto 1fr;
            gap: 12px; width: 100%; max-width: 1800px; margin: 0 auto; flex-grow: 1; 
        }

        .panel { 
            background: var(--glass-bg); border: 1px solid var(--panel-border); 
            border-radius: 6px; display: flex; flex-direction: column; 
            box-shadow: inset 0 0 20px rgba(0,0,0,0.9); overflow: hidden;
        }

        .panel-header { 
            font-size: 0.75rem; text-transform: uppercase; letter-spacing: 2px; color: #777; 
            border-bottom: 1px solid rgba(255,255,255,0.05); padding: 10px 15px; 
            display: flex; justify-content: space-between; align-items: center; background: rgba(0,0,0,0.4);
        }
        .highlight-text { color: var(--dekton-copper); font-weight: 700; }

        /* COLUNA 1: VARIAÇÕES */
        .variations-col { grid-column: 1; grid-row: 1 / -1; }
        .var-grid { display: flex; flex-direction: column; gap: 4px; padding: 12px; overflow-y: auto; }
        .var-card {
            background: rgba(0, 0, 0, 0.6); border-left: 3px solid rgba(255,255,255,0.1);
            padding: 10px 12px; border-radius: 4px; display: flex; justify-content: space-between; 
            align-items: center; border-right: 1px solid rgba(255,255,255,0.02); transition: all 0.2s;
        }
        .var-label { font-size: 0.75rem; color: #888; letter-spacing: 1px; font-weight: 600; }
        .var-value { font-family: 'Space Mono', monospace; font-size: 0.95rem; font-weight: 700; }
        
        .positive { color: var(--success-green); border-left-color: var(--success-green); background: linear-gradient(90deg, rgba(0,255,136,0.08) 0%, transparent 100%); }
        .negative { color: var(--danger-red); border-left-color: var(--danger-red); background: linear-gradient(90deg, rgba(255,42,64,0.08) 0%, transparent 100%); }

        /* COLUNA 2: GRÁFICO E RADARES */
        .tactical-col { grid-column: 2; grid-row: 1 / -1; display: flex; flex-direction: column; gap: 12px; }
        
        .chart-header { display: flex; gap: 6px; padding: 8px 12px; background: rgba(0,0,0,0.6); border-bottom: 1px solid rgba(255,255,255,0.05); }
        .tf-btn { background: rgba(255,255,255,0.05); color: #888; border: 1px solid rgba(255,255,255,0.05); padding: 5px 12px; border-radius: 4px; font-family: 'Space Mono', monospace; font-size: 0.75rem; font-weight: 700; cursor: pointer; transition: all 0.2s; }
        .tf-btn.active { background: var(--dekton-copper); color: #000; border-color: var(--dekton-copper); box-shadow: var(--neon-glow); }
        
        .chart-wrapper { flex-grow: 1; width: 100%; min-height: 380px; position: relative; }

        .dashboard-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        .price-huge { font-family: 'Space Mono', monospace; font-size: 2.2rem; font-weight: 700; margin: 10px 15px; transition: color 0.1s, text-shadow 0.1s; letter-spacing: -1px; }
        
        .controls { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; padding: 0 15px 15px 15px;}
        input { background: rgba(0,0,0,0.8); border: 1px solid var(--panel-border); color: var(--dekton-copper); font-family: 'Space Mono', monospace; font-size: 1rem; padding: 10px; border-radius: 4px; text-align: center; width: 100%; outline: none; }
        input:focus { border-color: var(--dekton-copper); box-shadow: var(--neon-glow); }
        
        /* COLUNA 3: UNISWAP E FITA */
        .local-col { grid-column: 3; grid-row: 1 / -1; display: flex; flex-direction: column; gap: 12px; }
        
        .spread-box { background: rgba(0,0,0,0.7); padding: 15px; margin: 0 15px 15px 15px; border-radius: 4px; text-align: center; border: 1px solid rgba(255,255,255,0.05); }
        .data-row { display: flex; justify-content: space-between; font-family: 'Space Mono', monospace; font-size: 0.8rem; padding: 8px 15px; border-bottom: 1px dashed rgba(255,255,255,0.1); }
        
        /* TAPE READING (FITA) */
        .tape-container { flex-grow: 1; display: flex; flex-direction: column; }
        .tape-header { display: grid; grid-template-columns: 55px 50px 1fr 1fr; padding: 10px 15px; border-bottom: 1px solid rgba(255,255,255,0.1); font-size: 0.65rem; text-transform: uppercase; color: #666; font-weight: 700; background: rgba(0,0,0,0.4); }
        .tape-row { display: grid; grid-template-columns: 55px 50px 1fr 1fr; padding: 8px 15px; font-family: 'Space Mono', monospace; font-size: 0.75rem; border-bottom: 1px solid rgba(255,255,255,0.02); align-items: center; animation: slide-down 0.25s ease-out forwards; }
        .type-buy { color: var(--success-green); } .type-sell { color: var(--danger-red); }
        @keyframes slide-down { 0% { opacity: 0; transform: translateY(-5px); background: rgba(205,164,52,0.3); } 100% { opacity: 1; transform: translateY(0); } }

        /* UTILITÁRIOS E BOTÃO START */
        .btn-start { width: 100%; padding: 15px; background: linear-gradient(90deg, #b8912d, #e6b93e); border: none; border-radius: 4px; color: #000; font-family: 'Rajdhani', sans-serif; font-size: 1.1rem; font-weight: 700; text-transform: uppercase; letter-spacing: 2px; cursor: pointer; margin-bottom: 12px; box-shadow: var(--neon-glow); transition: transform 0.1s; }
        .btn-start:active { transform: scale(0.98); }
        .pulse-dot { display: inline-block; width: 6px; height: 6px; border-radius: 50%; background-color: var(--success-green); box-shadow: 0 0 10px var(--success-green); animation: ws-pulse 1.5s infinite alternate; margin-right: 5px; }
        @keyframes ws-pulse { 0% { opacity: 0.3; transform: scale(0.8); } 100% { opacity: 1; transform: scale(1.2); } }
        
        .tick-up { color: var(--success-green) !important; text-shadow: 0 0 20px var(--success-green); }
        .tick-down { color: var(--danger-red) !important; text-shadow: 0 0 20px var(--danger-red); }

        /* ALERTAS */
        body.warning-mode .panel#panel-radar { border-color: var(--warning-yellow); animation: pulse-warning 1.5s infinite alternate; }
        @keyframes pulse-warning { 0% { box-shadow: inset 0 0 10px rgba(255,183,3,0.1); } 100% { box-shadow: inset 0 0 40px rgba(255,183,3,0.3); } }
        body.danger-mode .panel#panel-radar { border-color: var(--danger-red); animation: pulse-danger 0.5s infinite alternate; }
        @keyframes pulse-danger { 0% { box-shadow: inset 0 0 20px rgba(255,42,42,0.2); } 100% { box-shadow: inset 0 0 80px rgba(255,42,42,0.6); } }

        @media (max-width: 1100px) {
            .terminal-grid { grid-template-columns: 1fr; grid-template-rows: auto; }
            .variations-col { grid-column: 1; grid-row: 3; }
            .var-grid { display: grid; grid-template-columns: repeat(2, 1fr); }
            .tactical-col { grid-column: 1; grid-row: 1; }
            .local-col { grid-column: 1; grid-row: 2; }
            .dashboard-row { grid-template-columns: 1fr; }
            .chart-wrapper { min-height: 300px; }
        }
    </style>
</head>
<body>

    <button id="btn-init" class="btn-start">INICIAR TERMINAL RDESK (V5)</button>

    <div class="terminal-grid">
        
        <!-- COLUNA 1: VARIAÇÕES -->
        <div class="panel variations-col">
            <div class="panel-header"><span><span class="pulse-dot" style="background:#fff"></span> Radar OHLC</span><span class="highlight-text">VARIAÇÕES</span></div>
            <div class="var-grid" id="variations-grid">
                <div style="font-size:0.8rem; color:#666; text-align:center; padding:20px;">Sincronizando Histórico...</div>
            </div>
        </div>

        <!-- COLUNA 2: GRÁFICO BLINDADO E BINANCE -->
        <div class="tactical-col">
            <div class="panel" style="flex-grow: 1;">
                <div class="chart-header" id="tf-buttons">
                    <button class="tf-btn" data-interval="1m" data-seconds="60">1m</button>
                    <button class="tf-btn" data-interval="5m" data-seconds="300">5m</button>
                    <button class="tf-btn active" data-interval="15m" data-seconds="900">15m</button>
                    <button class="tf-btn" data-interval="1h" data-seconds="3600">1H</button>
                    <button class="tf-btn" data-interval="4h" data-seconds="14400">4H</button>
                </div>
                <!-- O Container do Gráfico agora é estéril, vazio e pronto pro Canvas -->
                <div class="chart-wrapper" id="tv-chart"></div>
            </div>

            <div class="dashboard-row">
                <div class="panel" id="panel-radar">
                    <div class="panel-header"><span><span class="pulse-dot" id="global-dot"></span> Binance Tracker</span><span class="highlight-text" id="alert-status">SEGURO</span></div>
                    <div id="price-global" class="price-huge">0.000000</div>
                    <div class="controls">
                        <div><div style="font-size:0.65rem; color:#888; margin-bottom:4px;">MÍNIMA (USDT)</div><input type="number" id="min-price" step="0.000001"></div>
                        <div><div style="font-size:0.65rem; color:#888; margin-bottom:4px;">MÁXIMA (USDT)</div><input type="number" id="max-price" step="0.000001"></div>
                    </div>
                </div>
            </div>
        </div>

        <!-- COLUNA 3: UNISWAP E FITA -->
        <div class="local-col">
            <div class="panel">
                <div class="panel-header"><span><span class="pulse-dot" style="background:var(--dekton-copper)"></span> Liquidez Exata</span><span class="highlight-text">UNISWAP</span></div>
                <div id="price-uniswap" class="price-huge" style="color: var(--dekton-copper);">0.000000</div>
                <div class="spread-box">
                    <div style="font-size:0.65rem; color:#888; letter-spacing:1px; margin-bottom:5px;">ARBITRAGEM SPREAD</div>
                    <div id="spread-value" style="font-family: 'Space Mono'; font-size: 1.4rem; font-weight: 700;">0.000%</div>
                </div>
                <div class="data-row"><span class="data-label">BRL ORACLE</span><span id="brl-rate">R$ 0,00</span></div>
                <div class="data-row" style="border:none;"><span class="data-label">TVL (POOL)</span><span id="uni-liq">$0.00</span></div>
            </div>

            <div class="panel" style="flex-grow: 1;">
                <div class="panel-header"><span><span class="pulse-dot" id="polygon-dot" style="background:#fff"></span> Scanner ETHERS.JS</span><span class="highlight-text">POLYGON</span></div>
                <div class="tape-container">
                    <div class="tape-header"><div>Hora</div><div>Tipo</div><div>BRL</div><div>Qtd (POL)</div></div>
                    <div id="tape" style="display: flex; flex-direction: column; overflow: hidden; padding-bottom: 5px;">
                        <div style="padding: 20px; text-align: center; color: #555; font-family: 'Space Mono'; font-size: 0.75rem;">[ AGUARDANDO REDE ]</div>
                    </div>
                </div>
            </div>
        </div>

    </div>

    <script>
        const SYMBOL = 'POLUSDT';
        const POOL_ADDRESS = '0x9B08288C3Be4F62bbf8d1C20Ac9C5e6f9467d8B7';
        
        const swapABI = ["event Swap(address indexed sender, address indexed recipient, int256 amount0, int256 amount1, uint160 sqrtPriceX96, uint128 liquidity, int24 tick)"];
        const iface = new ethers.utils.Interface(swapABI);
        const SWAP_TOPIC = iface.getEventTopic("Swap");
        
        let currentPriceGlobal = 0, lastPriceGlobal = 0, currentPriceUniswap = 0, lastPriceUniswap = 0; 
        let usdBrlRate = 5.80;
        let audioCtx = null, alarmInterval = null;
        let currentRiskState = 'SAFE', currentDeviationIntensity = 0; 

        // MOTOR TRADINGVIEW
        let chart, candleSeries;
        let currentInterval = '15m', currentIntervalSeconds = 900;
        let syntheticCandle = null;

        const priceGlobalEl = document.getElementById('price-global');
        const priceUniswapEl = document.getElementById('price-uniswap');
        const spreadEl = document.getElementById('spread-value');
        const tapeEl = document.getElementById('tape');
        const alertStatusEl = document.getElementById('alert-status');
        const bodyEl = document.body;
        const btnInit = document.getElementById('btn-init');

        const VAR_INTERVALS = [
            { label: '1 MINUTO', key: '1m', fetchType: 'standard' }, { label: '5 MINUTOS', key: '5m', fetchType: 'standard' }, 
            { label: '15 MINUTOS', key: '15m', fetchType: 'standard' }, { label: '30 MINUTOS', key: '30m', fetchType: 'standard' }, 
            { label: '1 HORA', key: '1h', fetchType: 'standard' }, { label: '4 HORAS', key: '4h', fetchType: 'standard' },
            { label: '8 HORAS', key: '8h', fetchType: 'standard' }, { label: '12 HORAS', key: '12h', fetchType: 'standard' }, 
            { label: '24 HORAS', key: '1d', fetchType: 'standard' }, { label: '1 SEMANA', key: '1w', fetchType: 'standard' }, 
            { label: '1 MÊS', key: '1M', fetchType: 'standard' }, { label: '1 ANO', key: '1M', fetchType: 'year' }
        ];

        // INICIALIZAÇÃO SEGURA (Evita efeito dominó se algo falhar)
        btnInit.addEventListener('click', async () => {
            try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); if (audioCtx.state === 'suspended') await audioCtx.resume(); } catch(e){}
            btnInit.style.display = 'none';
            tapeEl.innerHTML = '';
            
            setTimeout(() => { try { initTradingViewChart(); } catch(e){} }, 0);
            setTimeout(() => { try { buildVariationsPanel(); setInterval(buildVariationsPanel, 60000); } catch(e){} }, 50);
            setTimeout(() => { try { initGlobalTracker(); } catch(e){} }, 100);
            setTimeout(() => { try { initPolygonScanner(); } catch(e){} }, 150);
            setTimeout(() => { try { fetchOracleData(); setInterval(fetchOracleData, 60000); } catch(e){} }, 200);
        });

        // 1. GRÁFICO (TRADINGVIEW SEGURO)
        function initTradingViewChart() {
            const container = document.getElementById('tv-chart');
            chart = LightweightCharts.createChart(container, {
                width: container.clientWidth,
                height: container.clientHeight,
                layout: { background: { type: 'solid', color: 'transparent' }, textColor: '#888' },
                grid: { vertLines: { color: 'rgba(255,255,255,0.03)' }, horzLines: { color: 'rgba(255,255,255,0.03)' } },
                crosshair: { vertLine: { color: '#cda434', style: 3 }, horzLine: { color: '#cda434', style: 3 } },
                timeScale: { timeVisible: true, borderColor: 'rgba(255,255,255,0.1)' },
                rightPriceScale: { borderColor: 'rgba(255,255,255,0.1)' }
            });
            
            candleSeries = chart.addCandlestickSeries({ 
                upColor: '#00ff88', downColor: '#ff3366', borderVisible: false, 
                wickUpColor: '#00ff88', wickDownColor: '#ff3366', priceFormat: { type: 'price', precision: 6, minMove: 0.000001 }
            });

            new ResizeObserver(entries => {
                if (entries.length === 0 || entries[0].target !== container) return;
                chart.applyOptions({ height: entries[0].contentRect.height, width: entries[0].contentRect.width });
            }).observe(container);

            document.querySelectorAll('.tf-btn').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    document.querySelectorAll('.tf-btn').forEach(b => b.classList.remove('active'));
                    e.target.classList.add('active');
                    currentInterval = e.target.getAttribute('data-interval');
                    currentIntervalSeconds = parseInt(e.target.getAttribute('data-seconds'));
                    syntheticCandle = null;
                    loadChartHistory(currentInterval);
                });
            });
            loadChartHistory(currentInterval);
        }

        async function loadChartHistory(interval) {
            try {
                const res = await fetch(`https://api.binance.com/api/v3/klines?symbol=${SYMBOL}&interval=${interval}&limit=500`);
                if(!res.ok) throw new Error("CORS/Block");
                const data = await res.json();
                const klines = data.map(d => ({ time: Math.floor(d[0]/1000), open: parseFloat(d[1]), high: parseFloat(d[2]), low: parseFloat(d[3]), close: parseFloat(d[4]) }));
                candleSeries.setData(klines);
            } catch (e) {
                // Se o histórico falhar, não mata a tela preta, apenas prepara pra renderizar o vivo
                candleSeries.setData([]); 
            }
        }

        function updateLiveCandle(price) {
            if (!candleSeries || price === 0) return;
            const nowSec = Math.floor(Date.now() / 1000);
            const blockTime = Math.floor(nowSec / currentIntervalSeconds) * currentIntervalSeconds;

            if (!syntheticCandle || syntheticCandle.time !== blockTime) {
                syntheticCandle = { time: blockTime, open: price, high: price, low: price, close: price };
            } else {
                syntheticCandle.high = Math.max(syntheticCandle.high, price);
                syntheticCandle.low = Math.min(syntheticCandle.low, price);
                syntheticCandle.close = price;
            }
            candleSeries.update(syntheticCandle);
        }

        // 2. PAINEL DE VARIAÇÕES (COM CÁLCULO DE 1 ANO)
        async function buildVariationsPanel() {
            const grid = document.getElementById('variations-grid');
            let html = '';
            for (let v of VAR_INTERVALS) {
                try {
                    let limit = v.fetchType === 'year' ? 12 : 2; // Pra 1 ano, puxa 12 meses
                    const res = await fetch(`https://api.binance.com/api/v3/klines?symbol=${SYMBOL}&interval=${v.key}&limit=${limit}`);
                    const data = await res.json();
                    
                    if(data && data.length > 0) {
                        const current = parseFloat(data[data.length-1][4]); // Fechamento atual
                        const old = parseFloat(data[0][1]); // Abertura da vela antiga
                        const perc = ((current - old) / old) * 100;
                        const isPos = perc >= 0;
                        
                        html += `<div class="var-card ${isPos ? 'positive' : 'negative'}"><span class="var-label">${v.label}</span><span class="var-value">${isPos ? '+' : ''}${perc.toFixed(2)}%</span></div>`;
                    }
                } catch(e) { html += `<div class="var-card"><span class="var-label">${v.label}</span><span class="var-value" style="color:#555;">--</span></div>`; }
            }
            grid.innerHTML = html;
        }

        // 3. RASTREADORES E FITA
        function initGlobalTracker() {
            const ws = new WebSocket(`wss://stream.binance.com:9443/ws/${SYMBOL.toLowerCase()}@ticker`);
            const dot = document.getElementById('global-dot');
            ws.onmessage = (event) => {
                const newPrice = parseFloat(JSON.parse(event.data).c);
                if (lastPriceGlobal !== 0 && newPrice !== lastPriceGlobal) {
                    priceGlobalEl.classList.remove('tick-up', 'tick-down'); void priceGlobalEl.offsetWidth; 
                    const isUp = newPrice > lastPriceGlobal;
                    priceGlobalEl.classList.add(isUp ? 'tick-up' : 'tick-down');
                    if(currentRiskState === 'SAFE') playAudioTone(isUp ? 'tick-up' : 'tick-down');
                }
                lastPriceGlobal = newPrice; currentPriceGlobal = newPrice;
                priceGlobalEl.innerText = currentPriceGlobal.toFixed(6);
                dot.style.opacity = dot.style.opacity == 1 ? 0.3 : 1; 
                updateSpread(); processDynamicRisk(); updateLiveCandle(currentPriceGlobal);
            };
            ws.onclose = () => setTimeout(initGlobalTracker, 2000);
        }

        function initPolygonScanner() {
            const wsPool = new WebSocket('wss://polygon-bor-rpc.publicnode.com');
            const dot = document.getElementById('polygon-dot');
            wsPool.onopen = () => { wsPool.send(JSON.stringify({ "jsonrpc": "2.0", "id": 1, "method": "eth_subscribe", "params": ["logs", { "address": POOL_ADDRESS }] })); };
            
            wsPool.onmessage = (event) => {
                const response = JSON.parse(event.data);
                if (response.method === 'eth_subscription' && response.params.result.topics[0] === SWAP_TOPIC) {
                    dot.style.background = 'var(--dekton-copper)'; setTimeout(() => dot.style.background = '#fff', 500);
                    if(currentRiskState === 'SAFE') playAudioTone('pool-event');
                    
                    try {
                        const parsed = iface.parseLog(response.params.result);
                        const amount0 = parseFloat(ethers.utils.formatUnits(parsed.args.amount0.toString(), 18));
                        const amount1 = parseFloat(ethers.utils.formatUnits(parsed.args.amount1.toString(), 6));
                        
                        // ATUALIZA UNISWAP (Oscila Verde/Vermelho)
                        const newPrice = Math.abs(amount1 / amount0);
                        if (lastPriceUniswap !== 0 && newPrice !== lastPriceUniswap) {
                            priceUniswapEl.classList.remove('tick-up', 'tick-down'); priceUniswapEl.style.color = ''; void priceUniswapEl.offsetWidth; 
                            priceUniswapEl.classList.add(newPrice > lastPriceUniswap ? 'tick-up' : 'tick-down');
                            setTimeout(() => { priceUniswapEl.classList.remove('tick-up', 'tick-down'); priceUniswapEl.style.color = 'var(--dekton-copper)'; }, 1000);
                        }
                        lastPriceUniswap = newPrice; currentPriceUniswap = newPrice;
                        priceUniswapEl.innerText = currentPriceUniswap.toFixed(6);
                        updateSpread(); updateLiveCandle(currentPriceUniswap);
                        
                        // FITA DE TRANSAÇÕES
                        const isBuy = amount0 < 0;
                        const polVal = Math.abs(amount0).toLocaleString('pt-BR', {minimumFractionDigits:2, maximumFractionDigits: 4});
                        const brlVal = (Math.abs(amount1) * usdBrlRate).toLocaleString('pt-BR', {style: 'currency', currency: 'BRL'});
                        const time = new Date().toLocaleTimeString('pt-BR', { hour12: false });
                        
                        const row = document.createElement('div');
                        row.className = 'tape-row new-tx';
                        row.innerHTML = `<div>${time}</div><div class="${isBuy ? 'type-buy' : 'type-sell'}">${isBuy ? 'COMPRA' : 'VENDA'}</div><div>${brlVal}</div><div style="font-size:0.65rem;">${polVal} P</div>`;
                        
                        tapeEl.prepend(row);
                        setTimeout(() => { row.classList.remove('new-tx'); }, 1000);
                        if(tapeEl.children.length > 25) tapeEl.removeChild(tapeEl.lastChild);
                        
                    } catch (error) {}
                }
            };
            wsPool.onclose = () => setTimeout(initPolygonScanner, 3000);
        }

        async function fetchOracleData() {
            try { const res = await fetch('https://economia.awesomeapi.com.br/last/USD-BRL'); usdBrlRate = parseFloat((await res.json()).USDBRL.ask); document.getElementById('brl-rate').innerText = `R$ ${usdBrlRate.toFixed(4).replace('.',',')}`; } catch(e){}
            try { 
                const res = await fetch(`https://api.dexscreener.com/latest/dex/pairs/polygon/${POOL_ADDRESS}`); const pair = (await res.json()).pairs[0]; 
                document.getElementById('uni-liq').innerText = `$${parseFloat(pair.liquidity.usd).toLocaleString('en-US')}`; 
                if(currentPriceUniswap === 0) { currentPriceUniswap = parseFloat(pair.priceUsd); priceUniswapEl.innerText = currentPriceUniswap.toFixed(6); }
            } catch(e){}
        }

        function updateSpread() {
            if(currentPriceGlobal > 0 && currentPriceUniswap > 0) {
                const spread = ((currentPriceUniswap - currentPriceGlobal) / currentPriceGlobal) * 100;
                spreadEl.innerText = `${spread > 0 ? '+' : ''}${spread.toFixed(3)}%`;
                spreadEl.style.color = Math.abs(spread) > 0.2 ? 'var(--dekton-copper)' : '#fff';
            }
        }

        // 4. MOTOR DE RISCO INTELIGENTE
        const minInput = document.getElementById('min-price'), maxInput = document.getElementById('max-price');
        function processDynamicRisk() {
            const min = parseFloat(minInput.value), max = parseFloat(maxInput.value);
            if (isNaN(min) || isNaN(max) || min >= max) return;

            const price = currentPriceGlobal, amplitude = max - min, buffer = amplitude * 0.05; 
            if (price < min || price > max) {
                currentDeviationIntensity = Math.min((price < min ? min - price : price - max) / (amplitude * 0.1), 2.5); 
                if (currentRiskState !== 'DANGER') {
                    currentRiskState = 'DANGER'; bodyEl.classList.remove('warning-mode'); bodyEl.classList.add('danger-mode');
                    alertStatusEl.innerText = "IMPERMANENT LOSS"; alertStatusEl.style.color = 'var(--danger-red)';
                    clearInterval(alarmInterval); triggerDynamicSiren(); 
                }
            } else if (price <= min + buffer || price >= max - buffer) {
                if (currentRiskState !== 'WARNING') {
                    currentRiskState = 'WARNING'; bodyEl.classList.remove('danger-mode'); bodyEl.classList.add('warning-mode');
                    alertStatusEl.innerText = "5% DA BORDA"; alertStatusEl.style.color = 'var(--warning-yellow)';
                    clearInterval(alarmInterval); triggerWarningSonar();
                }
            } else {
                if (currentRiskState !== 'SAFE') {
                    currentRiskState = 'SAFE'; bodyEl.classList.remove('danger-mode', 'warning-mode');
                    alertStatusEl.innerText = "SEGURO"; alertStatusEl.style.color = 'var(--success-green)';
                    clearInterval(alarmInterval);
                }
            }
        }

        function triggerWarningSonar() { alarmInterval = setInterval(() => { if (!audioCtx) return; const osc = audioCtx.createOscillator(); const gain = audioCtx.createGain(); const now = audioCtx.currentTime; osc.type = 'sine'; osc.frequency.setValueAtTime(900, now); osc.frequency.exponentialRampToValueAtTime(1500, now + 0.2); gain.gain.setValueAtTime(0, now); gain.gain.linearRampToValueAtTime(0.3, now + 0.05); gain.gain.exponentialRampToValueAtTime(0.001, now + 0.3); osc.connect(gain); gain.connect(audioCtx.destination); osc.start(now); osc.stop(now + 0.3); }, 1500); }
        function triggerDynamicSiren() { function playSiren() { if (currentRiskState !== 'DANGER' || !audioCtx) return; const osc1 = audioCtx.createOscillator(); const osc2 = audioCtx.createOscillator(); const gainNode = audioCtx.createGain(); const now = audioCtx.currentTime; const freqMultiplier = 1 + (currentDeviationIntensity * 0.8); osc1.type = 'sawtooth'; osc2.type = 'square'; osc1.frequency.setValueAtTime(110 * freqMultiplier, now); osc1.frequency.exponentialRampToValueAtTime(440 * freqMultiplier, now + 0.3); osc2.frequency.setValueAtTime(220 * freqMultiplier, now); osc2.frequency.exponentialRampToValueAtTime(880 * freqMultiplier, now + 0.3); gainNode.gain.setValueAtTime(0, now); gainNode.gain.linearRampToValueAtTime(0.4, now + 0.05); gainNode.gain.exponentialRampToValueAtTime(0.01, now + 0.4); osc1.connect(gainNode); osc2.connect(gainNode); gainNode.connect(audioCtx.destination); osc1.start(now); osc2.start(now); osc1.stop(now + 0.4); osc2.stop(now + 0.4); alarmInterval = setTimeout(playSiren, Math.max(150, 800 - (currentDeviationIntensity * 400))); } playSiren(); }
        function playAudioTone(type) { if (!audioCtx || currentRiskState !== 'SAFE') return; const osc = audioCtx.createOscillator(); const gain = audioCtx.createGain(); const now = audioCtx.currentTime; if (type === 'tick-up') { osc.type = 'sine'; osc.frequency.setValueAtTime(800, now); osc.frequency.exponentialRampToValueAtTime(1200, now + 0.1); gain.gain.setValueAtTime(0, now); gain.gain.linearRampToValueAtTime(0.15, now + 0.02); gain.gain.exponentialRampToValueAtTime(0.001, now + 0.1); } else if (type === 'tick-down') { osc.type = 'sine'; osc.frequency.setValueAtTime(400, now); osc.frequency.exponentialRampToValueAtTime(250, now + 0.1); gain.gain.setValueAtTime(0, now); gain.gain.linearRampToValueAtTime(0.15, now + 0.02); gain.gain.exponentialRampToValueAtTime(0.001, now + 0.1); } else if (type === 'pool-event') { osc.type = 'triangle'; osc.frequency.setValueAtTime(2000, now); osc.frequency.exponentialRampToValueAtTime(4000, now + 0.1); gain.gain.setValueAtTime(0, now); gain.gain.linearRampToValueAtTime(0.3, now + 0.02); gain.gain.exponentialRampToValueAtTime(0.001, now + 0.3); } osc.connect(gain); gain.connect(audioCtx.destination); osc.start(now); osc.stop(now + 0.3); }

        minInput.addEventListener('input', () => { localStorage.setItem('minRange', minInput.value); processDynamicRisk(); }); maxInput.addEventListener('input', () => { localStorage.setItem('maxRange', maxInput.value); processDynamicRisk(); }); window.addEventListener('load', () => { if (localStorage.getItem('minRange')) minInput.value = localStorage.getItem('minRange'); if (localStorage.getItem('maxRange')) maxInput.value = localStorage.getItem('maxRange'); });
    </script>
</body>
</html>
