<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Terminal RDESK | Sentinela Uniswap V3</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;600;700&family=Space+Mono:wght@400;700&display=swap');

        :root {
            --bg-base: #070707;
            --dekton-copper: #cda434;
            --osb-warm: #d2a679;
            --danger-red: #ff2a2a;
            --success-green: #00ff88;
            --glass-bg: rgba(15, 14, 14, 0.75);
            --panel-border: rgba(205, 164, 52, 0.15);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background-color: var(--bg-base);
            background-image: 
                radial-gradient(circle at 10% 20%, rgba(205, 164, 52, 0.05), transparent 40%),
                radial-gradient(circle at 90% 80%, rgba(0, 255, 255, 0.02), transparent 40%);
            color: #fff;
            font-family: 'Rajdhani', sans-serif;
            min-height: 100vh;
            padding: 15px;
            display: flex;
            flex-direction: column;
            transition: background-color 0.3s ease;
        }

        /* GRID WALL STREET */
        .terminal-grid {
            display: grid;
            grid-template-columns: 1fr 1fr 1.2fr;
            gap: 15px;
            width: 100%;
            max-width: 1400px;
            margin: 0 auto;
            flex-grow: 1;
        }

        .panel {
            background: var(--glass-bg);
            backdrop-filter: blur(12px);
            border: 1px solid var(--panel-border);
            border-radius: 12px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            position: relative;
            overflow: hidden;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.8);
        }

        .panel-header {
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 3px;
            color: #888;
            border-bottom: 1px solid rgba(255,255,255,0.05);
            padding-bottom: 10px;
            margin-bottom: 15px;
            display: flex;
            justify-content: space-between;
        }

        .highlight-text { color: var(--dekton-copper); font-weight: 700; }

        /* TYPOGRAPHY & NUMBERS */
        .price-huge {
            font-family: 'Space Mono', monospace;
            font-size: 3rem;
            font-weight: 700;
            line-height: 1;
            margin: 10px 0;
            transition: color 0.1s, text-shadow 0.1s;
        }

        .data-row {
            display: flex;
            justify-content: space-between;
            font-family: 'Space Mono', monospace;
            font-size: 0.9rem;
            padding: 8px 0;
            border-bottom: 1px dashed rgba(255,255,255,0.1);
        }

        .data-label { font-family: 'Rajdhani', sans-serif; color: #aaa; text-transform: uppercase; letter-spacing: 1px; }
        
        /* TAPE READING (LIVRO DE OFERTAS) */
        .tape-container {
            flex-grow: 1;
            background: #000;
            border: 1px solid rgba(255,255,255,0.05);
            border-radius: 6px;
            padding: 10px;
            overflow-y: hidden;
            display: flex;
            flex-direction: column;
            gap: 4px;
            position: relative;
        }

        .tape-row {
            font-family: 'Space Mono', monospace;
            font-size: 0.75rem;
            display: flex;
            justify-content: space-between;
            padding: 4px 8px;
            background: rgba(255,255,255,0.03);
            border-left: 2px solid transparent;
            animation: slide-down 0.3s ease-out forwards;
        }

        .tape-row.new-tx { border-left-color: var(--dekton-copper); background: rgba(205, 164, 52, 0.1); color: var(--dekton-copper); }
        .tape-hash { opacity: 0.5; }

        @keyframes slide-down {
            0% { opacity: 0; transform: translateY(-10px); }
            100% { opacity: 1; transform: translateY(0); }
        }

        /* CONTROLES E ALARMES */
        .controls { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: auto; padding-top: 20px;}
        input {
            background: rgba(0, 0, 0, 0.8); border: 1px solid var(--panel-border);
            color: var(--dekton-copper); font-family: 'Space Mono', monospace; font-size: 1.1rem;
            padding: 10px; border-radius: 6px; text-align: center; width: 100%; outline: none;
        }
        input:focus { border-color: var(--dekton-copper); }
        
        .spread-box {
            background: rgba(0, 0, 0, 0.5);
            padding: 15px; border-radius: 8px; text-align: center; margin-top: 15px;
            border: 1px solid rgba(255,255,255,0.05);
        }

        .btn-start {
            grid-column: span 3; padding: 15px; background: linear-gradient(45deg, var(--dekton-copper), #e6b93e);
            border: none; border-radius: 8px; color: #000; font-family: 'Rajdhani', sans-serif;
            font-size: 1.2rem; font-weight: 700; text-transform: uppercase; letter-spacing: 2px;
            cursor: pointer; margin-bottom: 15px;
        }

        .pulse-dot {
            display: inline-block; width: 8px; height: 8px; border-radius: 50%;
            background-color: var(--success-green); box-shadow: 0 0 10px var(--success-green);
            animation: ws-pulse 1.5s infinite alternate; margin-right: 5px;
        }
        @keyframes ws-pulse { 0% { opacity: 0.3; transform: scale(0.8); } 100% { opacity: 1; transform: scale(1.2); } }

        /* Animações de Tick */
        .tick-up { animation: flash-green 0.5s ease-out; }
        .tick-down { animation: flash-red 0.5s ease-out; }
        @keyframes flash-green { 0% { color: var(--success-green); text-shadow: 0 0 20px var(--success-green); } 100% { color: #fff; } }
        @keyframes flash-red { 0% { color: var(--danger-red); text-shadow: 0 0 20px var(--danger-red); } 100% { color: #fff; } }

        /* ESTADO DE ALERTA */
        body.alert-mode .panel:first-child {
            border-color: var(--danger-red); box-shadow: 0 0 40px rgba(255, 42, 42, 0.2);
            animation: pulse-danger 1s infinite alternate;
        }
        @keyframes pulse-danger { 0% { box-shadow: inset 0 0 20px rgba(255, 42, 42, 0.1); } 100% { box-shadow: inset 0 0 60px rgba(255, 42, 42, 0.4); } }

        @media (max-width: 900px) {
            .terminal-grid { grid-template-columns: 1fr; }
            .btn-start { grid-column: span 1; }
        }
    </style>
</head>
<body>

    <button id="btn-init" class="btn-start">Injetar Telemetria & Áudio</button>

    <div class="terminal-grid">
        
        <!-- PAINEL 1: MERCADO GLOBAL (Binance) -->
        <div class="panel" id="panel-global">
            <div class="panel-header">
                <span><span class="pulse-dot"></span> Radar Global (WSS)</span>
                <span class="highlight-text">BINANCE</span>
            </div>
            
            <div id="price-binance" class="price-huge">0.0000</div>
            
            <div class="controls">
                <div>
                    <div class="data-label" style="font-size: 0.7rem; margin-bottom: 5px;">Mínima (USDT)</div>
                    <input type="number" id="min-price" step="0.0001">
                </div>
                <div>
                    <div class="data-label" style="font-size: 0.7rem; margin-bottom: 5px;">Máxima (USDT)</div>
                    <input type="number" id="max-price" step="0.0001">
                </div>
            </div>

            <div id="alert-status" style="margin-top: 15px; text-align: center; font-weight: 700; color: #888; font-family: 'Space Mono'; font-size: 0.8rem;">
                SENTINELA AGUARDANDO
            </div>
        </div>

        <!-- PAINEL 2: DADOS EXATOS DA POOL (Uniswap) -->
        <div class="panel">
            <div class="panel-header">
                <span><span class="pulse-dot" id="dot-uni" style="background:var(--dekton-copper); box-shadow: 0 0 10px var(--dekton-copper)"></span> Liquidez Local</span>
                <span class="highlight-text">UNISWAP V3</span>
            </div>
            
            <div id="price-uniswap" class="price-huge" style="color: var(--dekton-copper);">0.0000</div>
            
            <div class="spread-box">
                <div class="data-label">Arbitragem / Spread (Binance x Uniswap)</div>
                <div id="spread-value" style="font-family: 'Space Mono'; font-size: 1.5rem; font-weight: 700; margin-top: 5px;">0.00%</div>
            </div>

            <div style="margin-top: auto;">
                <div class="data-row"><span class="data-label">Volume (24h)</span><span id="uni-vol">$0.00</span></div>
                <div class="data-row"><span class="data-label">Liquidez Total</span><span id="uni-liq">$0.00</span></div>
                <div class="data-row" style="border: none;"><span class="data-label">Transações (24h)</span><span id="uni-txs">0</span></div>
            </div>
        </div>

        <!-- PAINEL 3: TAPE READING (Transações em Tempo Real) -->
        <div class="panel">
            <div class="panel-header">
                <span><span class="pulse-dot" style="background:#fff; box-shadow: 0 0 10px #fff"></span> Live Tape (Polygon WSS)</span>
                <span class="highlight-text">HASH LOG</span>
            </div>
            
            <div class="tape-container" id="tape">
                <!-- Linhas de transação serão injetadas aqui -->
                <div class="tape-row" style="justify-content: center; color: #555;">[ AGUARDANDO FLUXO DE REDE ]</div>
            </div>
        </div>

    </div>

    <script>
        const SYMBOL = 'POLUSDT';
        const POOL_ADDRESS = '0x9B08288C3Be4F62bbf8d1C20Ac9C5e6f9467d8B7';
        
        let currentPriceBinance = 0;
        let lastPriceBinance = 0;
        let currentPriceUniswap = 0;
        
        let audioCtx = null;
        let isAlarmPlaying = false;
        let alarmInterval = null;

        const priceBinanceEl = document.getElementById('price-binance');
        const priceUniswapEl = document.getElementById('price-uniswap');
        const spreadEl = document.getElementById('spread-value');
        const tapeEl = document.getElementById('tape');
        const alertStatusEl = document.getElementById('alert-status');
        const bodyEl = document.body;

        document.getElementById('btn-init').addEventListener('click', async () => {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            if (audioCtx.state === 'suspended') await audioCtx.resume();
            
            document.getElementById('btn-init').style.display = 'none';
            alertStatusEl.innerText = "[ DENTRO DA FAIXA SEGURA ]";
            alertStatusEl.style.color = 'var(--success-green)';
            
            tapeEl.innerHTML = ''; // Limpa o aviso inicial
            
            initBinanceWebSocket();
            initPolygonWebSocket();
            fetchUniswapData();
            setInterval(fetchUniswapData, 10000); // Atualiza os dados de profundidade a cada 10s
        });

        // 1. RADAR GLOBAL (Binance WebSocket)
        function initBinanceWebSocket() {
            const ws = new WebSocket(`wss://stream.binance.com:9443/ws/${SYMBOL.toLowerCase()}@ticker`);
            ws.onmessage = (event) => {
                const data = JSON.parse(event.data);
                const newPrice = parseFloat(data.c);
                
                if (lastPriceBinance !== 0 && newPrice !== lastPriceBinance) {
                    priceBinanceEl.classList.remove('tick-up', 'tick-down');
                    void priceBinanceEl.offsetWidth; // DOM Reflow
                    priceBinanceEl.classList.add(newPrice > lastPriceBinance ? 'tick-up' : 'tick-down');
                    playAudioTone(newPrice > lastPriceBinance ? 'tick-up' : 'tick-down');
                }
                
                lastPriceBinance = newPrice;
                currentPriceBinance = newPrice;
                priceBinanceEl.innerText = currentPriceBinance.toFixed(4);
                
                updateSpread();
                checkLiquidityRange();
            };
            ws.onclose = () => setTimeout(initBinanceWebSocket, 2000);
        }

        // 2. UNISWAP EXACT DATA (DexScreener API)
        // Busca o preço exato e dados estruturais da sua Pool de forma extremamente precisa
        async function fetchUniswapData() {
            try {
                const res = await fetch(`https://api.dexscreener.com/latest/dex/pairs/polygon/${POOL_ADDRESS}`);
                const json = await res.json();
                const pair = json.pairs[0];

                if(pair) {
                    currentPriceUniswap = parseFloat(pair.priceUsd);
                    priceUniswapEl.innerText = currentPriceUniswap.toFixed(4);
                    
                    document.getElementById('uni-vol').innerText = `$${parseFloat(pair.volume.h24).toLocaleString('en-US')}`;
                    document.getElementById('uni-liq').innerText = `$${parseFloat(pair.liquidity.usd).toLocaleString('en-US')}`;
                    document.getElementById('uni-txs').innerText = pair.txns.h24.buys + pair.txns.h24.sells;
                    
                    updateSpread();
                }
            } catch (e) { console.log("Aguardando DexScreener..."); }
        }

        // CÁLCULO DE SPREAD (Muro de Arbitragem)
        function updateSpread() {
            if(currentPriceBinance > 0 && currentPriceUniswap > 0) {
                const spread = ((currentPriceUniswap - currentPriceBinance) / currentPriceBinance) * 100;
                spreadEl.innerText = `${spread > 0 ? '+' : ''}${spread.toFixed(3)}%`;
                spreadEl.style.color = Math.abs(spread) > 0.2 ? 'var(--dekton-copper)' : '#fff';
            }
        }

        // 3. TAPE READING (Polygon RPC)
        function initPolygonWebSocket() {
            const wsPool = new WebSocket('wss://polygon-bor-rpc.publicnode.com');
            wsPool.onopen = () => {
                wsPool.send(JSON.stringify({ "jsonrpc": "2.0", "id": 1, "method": "eth_subscribe", "params": ["logs", { "address": POOL_ADDRESS }] }));
            };

            wsPool.onmessage = (event) => {
                const response = JSON.parse(event.data);
                if (response.method === 'eth_subscription') {
                    playAudioTone('pool-event');
                    
                    const log = response.params.result;
                    const hash = log.transactionHash.substring(0, 10) + '...';
                    const time = new Date().toLocaleTimeString('pt-BR', { hour12: false });
                    
                    const row = document.createElement('div');
                    row.className = 'tape-row new-tx';
                    row.innerHTML = `<span>[${time}] LOG CAPTURADO</span> <span class="tape-hash">${hash}</span>`;
                    
                    tapeEl.prepend(row);
                    
                    // Remove destaque após 1 segundo
                    setTimeout(() => { row.classList.remove('new-tx'); }, 1000);
                    
                    // Mantém apenas os últimos 15 registros na fita
                    if(tapeEl.children.length > 15) { tapeEl.removeChild(tapeEl.lastChild); }
                    
                    // Sempre que uma transação ocorre, força a atualização dos números da Uniswap
                    fetchUniswapData(); 
                }
            };
            wsPool.onclose = () => setTimeout(initPolygonWebSocket, 3000);
        }

        // CHECAGEM DE IMPERMANENT LOSS
        const minInput = document.getElementById('min-price');
        const maxInput = document.getElementById('max-price');
        
        function checkLiquidityRange() {
            const min = parseFloat(minInput.value);
            const max = parseFloat(maxInput.value);
            if (isNaN(min) || isNaN(max)) return;

            if (currentPriceBinance < min || currentPriceBinance > max) {
                if (!bodyEl.classList.contains('alert-mode')) {
                    bodyEl.classList.add('alert-mode');
                    alertStatusEl.innerText = "[ IMPERMANENT LOSS - FORA DA FAIXA ]";
                    alertStatusEl.style.color = 'var(--danger-red)';
                    triggerAlarm();
                }
            } else {
                if (bodyEl.classList.contains('alert-mode')) {
                    bodyEl.classList.remove('alert-mode');
                    alertStatusEl.innerText = "[ DENTRO DA FAIXA SEGURA ]";
                    alertStatusEl.style.color = 'var(--success-green)';
                    stopAlarm();
                }
            }
        }

        // 4. SISTEMA DE ÁUDIO SINTETIZADO NATIVO
        function playAudioTone(type) {
            if (!audioCtx || isAlarmPlaying) return;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            const now = audioCtx.currentTime;

            if (type === 'tick-up') {
                osc.type = 'sine'; osc.frequency.setValueAtTime(800, now); osc.frequency.exponentialRampToValueAtTime(1200, now + 0.1);
                gain.gain.setValueAtTime(0, now); gain.gain.linearRampToValueAtTime(0.15, now + 0.02); gain.gain.exponentialRampToValueAtTime(0.001, now + 0.1);
            } else if (type === 'tick-down') {
                osc.type = 'sine'; osc.frequency.setValueAtTime(400, now); osc.frequency.exponentialRampToValueAtTime(250, now + 0.1);
                gain.gain.setValueAtTime(0, now); gain.gain.linearRampToValueAtTime(0.15, now + 0.02); gain.gain.exponentialRampToValueAtTime(0.001, now + 0.1);
            } else if (type === 'pool-event') {
                // Som de campainha de bolsa / notificação cibernética
                osc.type = 'triangle'; osc.frequency.setValueAtTime(2000, now); osc.frequency.exponentialRampToValueAtTime(4000, now + 0.1);
                gain.gain.setValueAtTime(0, now); gain.gain.linearRampToValueAtTime(0.4, now + 0.02); gain.gain.exponentialRampToValueAtTime(0.001, now + 0.3);
            }

            osc.connect(gain); gain.connect(audioCtx.destination); osc.start(now); osc.stop(now + 0.3);
        }

        function playSirenPulse() {
            if (!audioCtx) return;
            const osc1 = audioCtx.createOscillator(); const osc2 = audioCtx.createOscillator(); const gainNode = audioCtx.createGain();
            const now = audioCtx.currentTime;
            osc1.type = 'sawtooth'; osc2.type = 'square';
            osc1.frequency.setValueAtTime(110, now); osc1.frequency.exponentialRampToValueAtTime(440, now + 0.4);
            osc2.frequency.setValueAtTime(220, now); osc2.frequency.exponentialRampToValueAtTime(880, now + 0.4);
            gainNode.gain.setValueAtTime(0, now); gain.gain.linearRampToValueAtTime(0.3, now + 0.1); gainNode.gain.exponentialRampToValueAtTime(0.01, now + 0.5);
            osc1.connect(gainNode); osc2.connect(gainNode); gainNode.connect(audioCtx.destination);
            osc1.start(now); osc2.start(now); osc1.stop(now + 0.5); osc2.stop(now + 0.5);
        }

        function triggerAlarm() { if (!isAlarmPlaying) { isAlarmPlaying = true; playSirenPulse(); alarmInterval = setInterval(playSirenPulse, 800); } }
        function stopAlarm() { isAlarmPlaying = false; clearInterval(alarmInterval); }

        minInput.addEventListener('input', () => localStorage.setItem('minRange', minInput.value));
        maxInput.addEventListener('input', () => localStorage.setItem('maxRange', maxInput.value));
        window.addEventListener('load', () => {
            if (localStorage.getItem('minRange')) minInput.value = localStorage.getItem('minRange');
            if (localStorage.getItem('maxRange')) maxInput.value = localStorage.getItem('maxRange');
        });
    </script>
</body>
</html>
