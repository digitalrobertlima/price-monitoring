# App Android privado: compila o APK, testa num emulador com o Tor de verdade,
# confere na captura de rede que nada sai fora do Tor, e publica na página de versões.
# Plano grátis do GitHub. Sem Play Store, sem conta no Google.
name: App Android
on:
  push:
    paths:
      - 'android/**'
      - '*.js'
      - '*.css'
      - 'index.html'
      - 'audio/**'
      - 'fonts/**'
      - 'vendor/**'
      - 'icons/**'
      - 'tests/apk-ponte.mjs'
      - '.github/workflows/android.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      ANDROID_KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASS }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.9.2

      - name: Arquivos do app + ponte do Tor
        run: |
          bash android/tools/preparar.sh
          node tests/apk-ponte.mjs
          VER=$(sed -n "s/.*RDESK_VERSION = '\(v[0-9.]*\)'.*/\1/p" version.js)
          echo "VER=$VER" >> "$GITHUB_ENV"

      - name: Chave de assinatura (Secrets do repositório)
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          if [ -n "$KS" ] && [ -n "$ANDROID_KEYSTORE_PASS" ]; then
            echo "$KS" | base64 -d > android/keystore.jks
            echo "SIGNED=1" >> "$GITHUB_ENV"
            echo "APK assinado com a chave do projeto."
          else
            echo "::warning::Sem a chave do projeto nos Secrets: o APK sai com chave de teste e NÃO é publicado."
          fi

      - name: Plataforma Android 37 (exigida pelo Tor embutido)
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses >/dev/null || true
          "$SDKM" --list 2>/dev/null | grep -oE "platforms;android-3[6-9][^ ]*" | sort -u
          "$SDKM" "platforms;android-37.2" "build-tools;37.0.0" || "$SDKM" "platforms;android-37.2"
          ls "$ANDROID_HOME/platforms"

      - name: Compilar
        run: gradle -p android --no-daemon --stacktrace assembleRelease assembleReleaseAndroidTest

      - name: Liberar o emulador (KVM)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Teste no emulador (Tor de verdade + captura de toda a rede)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: default
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -tcpdump ${{ github.workspace }}/rede.pcap
          script: |
            adb logcat -c
            nohup sudo tcpdump -i "$(ip route | awk '/^default/ {print $5; exit}')" -nn -s 0 -w /tmp/host.pcap 'not port 5037 and not port 5555 and not port 5554' > /tmp/tcpdump.log 2>&1 &
            sleep 3
            getent hosts example.org > /dev/null || true
            gradle -p android --no-daemon connectedReleaseAndroidTest || (adb logcat -d -s RDESKTEST:I TorService:I AndroidRuntime:E > logcat.txt; exit 1)
            adb logcat -d -s RDESKTEST:I > logcat.txt
            sudo pkill -INT tcpdump || true
            sleep 3

      - name: Relatório do teste
        if: always()
        run: cat logcat.txt 2>/dev/null || echo "sem logcat"

      - name: Nada fora do Tor (nomes dos serviços nunca aparecem na rede)
        run: |
          sudo chmod a+r /tmp/host.pcap
          # Captura da placa de rede do computador: tudo que o emulador manda para a internet passa por ela.
          # (O tráfego interno do adb, que instala o APK, fica de fora: ele contém o código do app.)
          # Controle positivo: o nome consultado de propósito no computador TEM que aparecer (prova que a captura funciona).
          echo "Captura do computador: $(stat -c %s /tmp/host.pcap) bytes, $(sudo tcpdump -nn -r /tmp/host.pcap 2>/dev/null | wc -l) pacotes"
          strings -n 6 /tmp/host.pcap | grep -qi "example.org" || { echo "A captura não está funcionando (controle não apareceu)"; exit 1; }
          echo "Controle OK: a captura enxerga DNS."
          LEAK=""
          for f in /tmp/host.pcap rede.pcap; do
            [ -s "$f" ] || continue
            for h in coins.llama.fi coingecko.com publicnode.com drpc.org 1rpc.io mainnet.base.org arbitrum.io bnbchain.org forno.celo.org hyperliquid.xyz mempool.space blockstream.info blockscout.com olinda.bcb.gov.br li.quest insight.dash.org torproject.org example.com; do
              if strings -n 6 "$f" | grep -qi "$h"; then echo "VAZOU em $f: $h apareceu fora do Tor"; LEAK=1; fi
            done
          done
          if [ -n "$LEAK" ]; then exit 1; fi
          echo "OK: o app falou com 19 serviços e nenhum deles aparece na rede (nem no DNS, nem no TLS). Só tráfego cifrado do Tor."

      - name: Empacotar
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/release/app-release.apk "dist/rdesk-$VER.apk"
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BT/apksigner" verify --print-certs "dist/rdesk-$VER.apk" | tee dist/certificado.txt
          cd dist
          sha256sum "rdesk-$VER.apk" > "rdesk-$VER.apk.sha256"
          cat "rdesk-$VER.apk.sha256"
          echo "Tamanho: $(du -h "rdesk-$VER.apk" | cut -f1)"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: apk-${{ github.sha }}
          path: |
            dist/
            logcat.txt
          retention-days: 7

      - name: Publicar na página de versões
        if: github.ref == 'refs/heads/main' && env.SIGNED == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          CERT=$(grep -m1 'SHA-256 digest' dist/certificado.txt | sed 's/.*: //')
          SUM=$(cut -d' ' -f1 "dist/rdesk-$VER.apk.sha256")
          cat > notas.md <<EOF
          **App Android do cofre — $VER**, com o Tor embutido. Nada sai do app fora do Tor.

          **Instalar:** baixe \`rdesk-$VER.apk\` no celular, abra e permita "instalar apps desconhecidos". Em celulares com a verificação do Google, use o modo avançado (Configurações → Opções do desenvolvedor).

          **Conferir antes de instalar (opcional):**
          - SHA-256 do APK: \`$SUM\`
          - Certificado de assinatura (SHA-256): \`$CERT\`. Toda versão futura terá **o mesmo** certificado.

          **Testado no emulador antes de publicar:** o Tor conecta, a saída é pelo Tor (check.torproject.org) e a captura de rede não mostra nenhum serviço do app fora do Tor.

          **Atualizações:** o app avisa (consultando pelo Tor) quando houver versão nova. Para atualizar sozinho, use o Obtainium com este repositório.
          EOF
          sed -i 's/^          //' notas.md
          gh release view "android-$VER" >/dev/null 2>&1 && gh release delete "android-$VER" --yes --cleanup-tag
          gh release create "android-$VER" dist/rdesk-$VER.apk dist/rdesk-$VER.apk.sha256 dist/certificado.txt --title "App Android $VER (Tor embutido)" --notes-file notas.md --latest=false --target "$GITHUB_SHA"
          # Link fixo que sempre aponta para o APK mais novo
          cp "dist/rdesk-$VER.apk" dist/rdesk.apk
          gh release delete android --yes --cleanup-tag 2>/dev/null || true
          gh release create android dist/rdesk.apk dist/rdesk-$VER.apk.sha256 --title "App Android — sempre a versão mais nova" --notes-file notas.md --latest=false --target "$GITHUB_SHA"
