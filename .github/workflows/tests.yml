name: Testes

on:
  push:
    branches: [main, 'ci/**', 'fix/**', 'feat/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    name: Página e leitura on-chain (rede real)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: for f in range-chart.js registry.js bitcoin.js qr-scanner.js wallet-views.js onboarding.js history.js wallet-service.js defi-pix-service.js app.js sw.js; do node --check "$f"; done
      - run: npm run test:smoke

  fluxo:
    name: Carteiras, várias redes, Bitcoin e fluxo de dinheiro (redes simuladas)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: npm test
