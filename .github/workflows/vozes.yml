# Gera as vozes naturais da Duda e do Bit (Kokoro-82M, Apache 2.0) sempre que as falas mudam.
# Roda no plano grátis do GitHub Actions e grava os áudios na própria branch.
name: Vozes da Duda e do Bit
on:
  workflow_dispatch:
  push:
    branches-ignore: [main]
    paths: ['lessons.js', 'tools/vozes/**', '.github/workflows/vozes.yml']
permissions:
  contents: write
concurrency:
  group: vozes-${{ github.ref }}
  cancel-in-progress: true
jobs:
  vozes:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - name: Programas de áudio
        run: sudo apt-get update -qq && sudo apt-get install -y -qq espeak-ng ffmpeg
      - name: Kokoro (CPU)
        run: |
          pip install -q torch --index-url https://download.pytorch.org/whl/cpu
          pip install -q "kokoro>=0.9.4" soundfile numpy
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: kokoro-82m-v1
      - name: Lista de falas
        run: node tools/vozes/linhas.mjs > tools/vozes/linhas.json
      - name: Gerar vozes
        run: python tools/vozes/gerar.py
      - name: Gravar na branch
        run: |
          git config user.name "Claude"
          git config user.email "noreply@anthropic.com"
          git add audio tools/vozes/linhas.json
          if git diff --cached --quiet; then echo "Nenhuma voz nova."; exit 0; fi
          git commit -m "Vozes da Duda e do Bit (Kokoro-82M)" -m "Co-Authored-By: Claude Opus 5.5 <noreply@anthropic.com>" -m "Claude-Session: https://claude.ai/code/session_01MQvxbaWD3asFxYF8JGxcgi"
          git push
