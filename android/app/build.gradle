plugins { id 'com.android.application' }

// Versão do app = a mesma do site (version.js). v46 → 4600, v46.1 → 4610.
def verText = file('../../version.js').text
def vname = (verText =~ /RDESK_VERSION = '(v[0-9.]+)'/)[0][1]
def parts = vname.substring(1).tokenize('.')
def vcode = (parts[0] as int) * 100 + (parts.size() > 1 ? (parts[1] as int) * 10 : 0)
def ks = file('../keystore.jks')

android {
    namespace 'app.rdesk.cofre'
    compileSdk 35

    defaultConfig {
        applicationId 'app.rdesk.cofre'
        minSdk 24
        targetSdk 35
        versionCode vcode
        versionName vname
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }

    signingConfigs {
        release {
            if (ks.exists()) {
                storeFile ks
                storePassword System.getenv('ANDROID_KEYSTORE_PASS')
                keyAlias System.getenv('ANDROID_KEY_ALIAS')
                keyPassword System.getenv('ANDROID_KEYSTORE_PASS')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig ks.exists() ? signingConfigs.release : signingConfigs.debug
        }
    }
    testBuildType 'release'

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildFeatures { buildConfig true }
    lint { abortOnError false; checkReleaseBuilds false }
    dependenciesInfo { includeInApk false; includeInBundle false }
}

dependencies {
    implementation 'info.guardianproject:tor-android:0.4.9.17'
    implementation 'androidx.localbroadcastmanager:localbroadcastmanager:1.1.0'
    implementation 'androidx.webkit:webkit:1.12.1'
    implementation 'androidx.core:core:1.13.1'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test:core:1.6.1'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
}
